# =============================================================================
# DOCKER-COMPOSE.YML - Development Environment
# Hải quan KV8 Backend
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: haiquan_kv8_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: haiquan_kv8
      # Timezone Vietnam
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      # Persistent data
      - postgres_data:/var/lib/postgresql/data
      # Custom initialization scripts (optional)
      # - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haiquan_kv8"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - haiquan_network

  # ---------------------------------------------------------------------------
  # pgAdmin (Database Management UI) - Optional
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: haiquan_kv8_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@haiquan.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - haiquan_network
    profiles:
      - tools  # Chỉ chạy khi: docker-compose --profile tools up

  # ---------------------------------------------------------------------------
  # Redis (cho caching & session - optional, dùng sau)
  # ---------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: haiquan_kv8_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - haiquan_network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  # redis_data:
  #   driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  haiquan_network:
    driver: bridge
