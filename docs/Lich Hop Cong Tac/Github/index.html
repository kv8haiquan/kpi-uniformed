<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.google.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://docs.google.com https://*.googleusercontent.com https://*.gstatic.com; frame-src 'self' https://vuquyhung-qni.github.io https://*.github.io https://drive.google.com https://docs.google.com https://script.google.com https://script.googleusercontent.com https://*.google.com https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self' https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com;">
  <title>Quản lý lịch công tác HQKV8</title>
  <!-- PWA_V86_START -->
  <!-- V102: fix JS regex newline causing login buttons not to run -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#063a63">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lịch công tác HQKV8">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <!-- PWA_V86_END -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:   #063a63;
      --navy2:  #0f4c81;
      --blue:   #0f4c81;
      --blue2:  #0b67b2;
      --blue3:  #38a3d1;
      --gold:   #c89a00;
      --gold2:  #f0c040;
      --bg:     #f7f9fc;
      --bg2:    #eef4fb;
      --card:   #fff;
      --text:   #1f2933;
      --text2:  #3d5166;
      --muted:  #5f6b76;
      --border: #d9e3ec;
      --border2:#e6eef6;
      --red:    #b3261e;
      --green:  #0b7a4b;
      --orange: #b76b00;
      --sidebar-w: 252px;
      --shadow-sm: 0 2px 8px rgba(6,58,99,.07);
      --shadow: 0 8px 24px rgba(6,58,99,.11);
      --shadow-lg: 0 20px 56px rgba(6,58,99,.17);
      --r: 12px;
      --r-sm: 9px;
      --r-xs: 6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    body.modal-lock { overflow: hidden; }
    button { cursor: pointer; }
    a { color: var(--blue); text-decoration: none; }

    .hide { display: none !important; }
    .muted { color: var(--muted); }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: .82em; }
    .nowrap { white-space: nowrap; }
    .bold { font-weight: 700; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ===== LOGIN ===== */
    .login-wrap {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(145deg, #031d38 0%, #063a63 45%, #0f6fb0 80%, #063a63 100%);
      position: relative;
      overflow: hidden;
    }
    .login-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 70% 30%, rgba(45,120,239,.22) 0%, transparent 70%),
                  radial-gradient(ellipse 40% 60% at 10% 80%, rgba(212,160,23,.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-wrap::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 50%;
      top: -100px; right: -100px;
      pointer-events: none;
    }
    .login-card {
      width: min(420px, 100%);
      background: rgba(255,255,255,.97);
      border-radius: 22px;
      box-shadow: 0 32px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.15);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: fadeUp .45s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(20px) } to { opacity:1; transform:none } }
    .login-banner {
      padding: 30px 28px 22px;
      background: linear-gradient(135deg, #063a63 0%, #0b67b2 100%);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .login-banner::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,.05);
      top: -60px; right: -40px;
    }
    .login-logo {
      width: 82px; height: 82px;
      object-fit: contain;
      display: block;
      margin: 0 auto 14px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,.35));
      position: relative;
      z-index: 1;
    }
    .login-banner .line1 {
      font-size: .82rem;
      font-weight: 600;
      color: rgba(255,255,255,.85);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin: 0 0 3px;
      position: relative;
      z-index: 1;
    }
    .login-banner .line2 {
      font-size: .82rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin: 0 0 10px;
      position: relative;
      z-index: 1;
      line-height: 1.35;
    }
    .login-banner .line3 {
      font-size: 1.23rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .6px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .login-divider {
      height: 3px;
      background: linear-gradient(90deg, var(--gold) 0%, var(--gold2) 50%, var(--gold) 100%);
    }
    .login-body { padding: 26px 28px 30px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 7px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 11px 13px;
      background: #fafbff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      color: var(--text);
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--blue2);
      box-shadow: 0 0 0 3px rgba(45,120,239,.14);
      background: #fff;
    }
    .field input[readonly] { background: var(--bg2); color: var(--muted); }
    .field .hint { font-size: .72rem; color: var(--muted); margin-top: 5px; }

    /* ===== BUTTONS ===== */
    .btn {
      border: none;
      border-radius: var(--r-sm);
      padding: 10px 16px;
      font-weight: 600;
      font-size: .88rem;
      background: var(--bg2);
      color: var(--text2);
      transition: all .18s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(.96); transform: translateY(-1px); }
    .btn:active { transform: none; filter: brightness(.9); }
    .btn.primary {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #fff;
      box-shadow: 0 6px 18px rgba(11,103,178,.26);
    }
    .btn.primary:hover { box-shadow: 0 8px 22px rgba(21,86,200,.36); }
    .btn.danger { background: #fee2e2; color: #991b1b; }
    .btn.warn { background: #fff7ed; color: #9a3412; }
    .btn.ok { background: #dcfce7; color: #166534; }
    .btn.ghost { background: transparent; border: 1.5px solid var(--border); }
    .btn.sm { padding: 7px 11px; font-size: .8rem; border-radius: var(--r-xs); }
    .btn.xs { padding: 4px 8px; font-size: .75rem; border-radius: 6px; }
    .btn.full { width: 100%; justify-content: center; }
    .btn:disabled { opacity: .55; pointer-events: none; }

    /* ===== MESSAGES ===== */
    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      background: var(--bg2);
      color: var(--text2);
      font-size: .88rem;
      border-left: 3px solid var(--border);
    }
    .msg.err { background: #fef2f2; color: #991b1b; border-color: var(--red); }
    .msg.ok { background: #f0fdf4; color: #166534; border-color: var(--green); }

    /* ===== LAYOUT ===== */
    .layout { display: flex; min-height: 100svh; }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: linear-gradient(180deg, #063a63 0%, #0b5a96 55%, #063a63 100%);
      color: #fff;
      position: sticky;
      top: 0;
      height: 100svh;
      display: flex;
      flex-direction: column;
      z-index: 30;
      border-right: 1px solid rgba(255,255,255,.06);
    }
    .brand {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-logo { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,.3)); }
    .brand-text h2 {
      font-size: .78rem;
      font-weight: 800;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .brand-text p { font-size: .68rem; color: rgba(255,255,255,.55); margin-top: 2px; }
    .nav { padding: 14px 10px; flex: 1; overflow-y: auto; }
    .nav-section-label {
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(255,255,255,.42);
      padding: 10px 10px 5px;
    }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,.7);
      padding: 10px 12px;
      border-radius: var(--r-sm);
      text-align: left;
      font-weight: 500;
      font-size: .88rem;
      margin-bottom: 2px;
      transition: all .18s;
      position: relative;
    }
    .nav-btn .nav-icon { font-size: 1.1rem; width: 22px; text-align: center; flex-shrink: 0; }
    .nav-btn .nav-label { flex: 1; }
    .nav-btn .badge {
      background: var(--gold2);
      color: #0b1f45;
      border-radius: 99px;
      padding: 1px 7px;
      font-size: .7rem;
      font-weight: 800;
    }
    .nav-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .nav-btn.active {
      background: rgba(255,255,255,.15);
      color: #fff;
      font-weight: 700;
    }
    .nav-btn.active::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 60%;
      background: var(--gold2);
      border-radius: 0 3px 3px 0;
      box-shadow: 0 0 8px rgba(240,192,64,.5);
    }
    .side-foot {
      padding: 14px 10px;
      border-top: 1px solid rgba(255,255,255,.1);
      position: relative;
    }
    .userbox {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,.08);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      cursor: pointer;
      position: relative;
      transition: background .18s, box-shadow .18s;
    }
    .userbox:hover { background: rgba(255,255,255,.13); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .userbox::after {
      content: '⌄';
      margin-left: auto;
      color: rgba(255,255,255,.68);
      font-weight: 900;
      transition: transform .18s;
    }
    .userbox.open::after { transform: rotate(180deg); }
    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0b1f45;
      font-weight: 900;
      font-size: .85rem;
      flex-shrink: 0;
    }
    .userbox-info b { display: block; font-size: .84rem; line-height: 1.2; }
    .userbox-info span { font-size: .7rem; color: rgba(255,255,255,.6); }
    .side-actions { display: flex; gap: 6px; margin-top: 10px; }
    .side-actions button {
      flex: 1;
      border: none;
      border-radius: var(--r-xs);
      padding: 7px;
      font-size: .75rem;
      font-weight: 600;
      background: rgba(255,255,255,.1);
      color: rgba(255,255,255,.8);
      transition: background .18s;
    }
    .side-actions button:hover { background: rgba(255,255,255,.18); color: #fff; }
    .side-actions button.logout-btn { background: rgba(220,50,50,.2); color: #fca5a5; }
    .side-actions button.logout-btn:hover { background: rgba(220,50,50,.35); }
    .side-user-menu {
      display: none;
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: calc(100% - 14px);
      z-index: 65;
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(15,76,129,.16);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0,0,0,.28);
      overflow: hidden;
      padding: 6px;
    }
    .side-user-menu.show { display: block; animation: sideUserMenuIn .16s ease-out; }
    @keyframes sideUserMenuIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .side-user-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text2);
      border-radius: 10px;
      padding: 10px 11px;
      text-align: left;
      font-size: .86rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .side-user-menu button:hover { background: #eef6ff; color: var(--blue); }
    .side-user-menu button.logout-btn { color: #dc2626; }
    .side-user-menu button.logout-btn:hover { background: #fee2e2; color: #b91c1c; }

    /* ===== MAIN ===== */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ===== TOPBAR ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(247,249,252,.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border2);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-inner { flex: 1; min-width: 0; }
    .topbar-title { margin:0; font-size:.98rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--navy); }
    .topbar-sub { margin:1px 0 0; font-size:.75rem; color:var(--muted); }
    .topbar-mobile-title { display:none; align-items:center; justify-content:flex-start; gap:8px; }
    .topbar-mobile-title span { font-size:1rem; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--navy); }
    .topbar-logo { height:1.15rem; width:auto; object-fit:contain; filter:drop-shadow(0 1px 3px rgba(0,0,0,.2)); flex-shrink:0; }
    .hamb {
      display: none;
      border: 1.5px solid var(--border);
      background: #fff;
      border-radius: var(--r-xs);
      padding: 7px 9px;
      font-size: 1rem;
      color: var(--text2);
    }
    .page-title h1 {
      font-size: .98rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--navy);
    }
    .page-title p { font-size: .75rem; color: var(--muted); margin-top: 1px; }
    .topbar-actions { margin-left: auto; display: flex; gap: 7px; align-items: center; }

    /* ===== CONTENT ===== */
    .content { padding: 20px 22px; flex: 1; }

    /* ===== STAT CARDS ===== */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat-card {
      background: #fff;
      border-radius: var(--r);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border2);
      position: relative;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #c4d6ea; }
    .stat-active {
      box-shadow: inset 0 0 0 1px rgba(15,76,129,.20), var(--shadow-sm) !important;
      border-color: rgba(15,76,129,.22) !important;
      transform: none;
    }
    .th-active,.td-active { background: #eff6ff !important; color: var(--blue) !important; font-weight:800; }
    .stat-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--blue2));
    }
    .stat-card:nth-child(2)::after { background: linear-gradient(90deg, #6c35c8, #9c5fef); }
    .stat-card:nth-child(3)::after { background: linear-gradient(90deg, #059669, #10b981); }
    .stat-card:nth-child(4)::after { background: linear-gradient(90deg, var(--gold), var(--gold2)); }
    .stat-k { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat-v { font-size: 2rem; font-weight: 900; color: var(--navy); line-height: 1.1; margin: 5px 0 3px; }
    .stat-sub { font-size: .72rem; color: var(--muted); }
    .stat-card.stat-today { background: linear-gradient(180deg,#fff 0%,#f8fbff 100%); }
    .stat-card.stat-tomorrow { background: linear-gradient(180deg,#fff 0%,#f0fbff 100%); }
    .stat-card.stat-tomorrow::after { background: linear-gradient(90deg,#38a3d1,#0b67b2); }
    .stat-card.stat-week  { background: linear-gradient(180deg,#fff 0%,#fbf8ff 100%); }
    .stat-card.stat-month { background: linear-gradient(180deg,#fff 0%,#f5fff9 100%); }
    .stat-card.stat-year  { background: linear-gradient(180deg,#fff 0%,#fffdf3 100%); }
    .stat-card.stat-total::after { background: linear-gradient(90deg,#0f4c81,#0b67b2); }
    .stat-card.stat-published::after { background: linear-gradient(90deg,#059669,#10b981); }
    .stat-card.stat-draft::after { background: linear-gradient(90deg,#6c35c8,#9c5fef); }
    .stat-card.stat-cancelled::after { background: linear-gradient(90deg,#b3261e,#ef4444); }
    .leader-full { display: inline; }
    .leader-short { display: none; }

    /* ===== PANEL ===== */
    .panel {
      background: #fff;
      border-radius: var(--r);
      border: 1px solid var(--border2);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .panel-h {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border2);
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #f7fbff, #fff);
    }
    .panel-h h3 { font-size: .92rem; font-weight: 700; color: var(--navy); flex: 1; }
    .panel-b { padding: 16px 18px; }
    .library-panel { height: calc(100svh - 126px); display: flex; flex-direction: column; }
    .library-panel .panel-h { flex-shrink: 0; }
    .library-head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .library-title-back {
      display: none;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border: 1.5px solid #cfe0f2;
      background: #fff;
      color: var(--blue);
      border-radius: 10px;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(6,58,99,.07);
    }
    .library-title-back:active { transform: scale(.97); }
    .library-nav-actions { display:flex; gap:6px; align-items:center; margin-right:6px; }
    .library-icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--navy);
      display: inline-grid;
      place-items: center;
      font-size: 1rem;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(6,58,99,.06);
      transition: all .18s;
    }
    .library-icon-btn:hover { border-color: var(--blue2); color: var(--blue2); transform: translateY(-1px); }
    .library-icon-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .library-icon-btn.close { color: #991b1b; background: #fff5f5; border-color: #fecaca; }
    .library-icon-btn.close:hover { color: #fff; background: #dc2626; border-color: #dc2626; }
    .library-crumb {
      padding: 7px 18px;
      border-bottom: 1px solid var(--border2);
      background: #f8fbff;
      color: var(--text2);
      font-size: .78rem;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .library-crumb b { color: var(--navy); }

    /* ===== LIBRARY FILE POPUP ===== */

    /* V23: vùng thân popup dùng nền sáng thống nhất và cho viewer chiếm toàn bộ khung.
       Với PDF, HTML dùng link Drive trực tiếp để trình PDF của trình duyệt tự hiển thị, giảm nền đen của Google Drive preview. */

    /* ===== FILTERBAR ===== */

    /* ===== MEETING CARDS ===== */
    .cards { display: grid; gap: 11px; }
    .meeting-card {
      background: #fff;
      border: 1px solid var(--border2);
      border-left: 3px solid var(--blue);
      border-radius: var(--r);
      padding: 15px 16px;
      box-shadow: var(--shadow-sm);
      transition: all .18s;
      position: relative;
    }

    .pill.status-PUBLISHED { background: #e4f7ee; color: #0b6e42; }
    .pill.status-CANCELLED { background: #fee2e2; color: #991b1b; }
    .pill.status-COMPLETED { background: #e0f2fe; color: #0369a1; }

      color: var(--navy);

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; border-radius: var(--r-xs); }

    .tbl tr:hover td { background: #fafbff; }

    /* Đồng bộ màu chữ màn hình Quản lý lịch với tông xanh chung */
    #screen-manage .tbl td { color: var(--text2); }
    #screen-manage .tbl td b { color: var(--navy); font-weight: 800; }
    #screen-manage .tbl td.mono { color: var(--blue); font-weight: 800; }
    #screen-manage .tbl td.nowrap { color: var(--navy); font-weight: 700; }
    #screen-manage .tbl td:nth-child(4) { color: var(--text2); font-weight: 600; }

    #screen-manage .tbl tr:hover td { background: #f7fbff; }
    #screen-manage .toolbar input, #screen-manage .toolbar select { color: var(--text2); }

    .leader-table td:nth-child(n+2), .leader-table th:nth-child(n+2) { text-align: center; }

    .barline { height: 6px; background: var(--bg2); border-radius: 99px; overflow: hidden; min-width: 80px; }
    .barline span { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue2)); border-radius: 99px; }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(7,15,38,.55);
      backdrop-filter: blur(4px);

      padding: 16px;

    .modal-card {
      width: min(1000px, 100%);
      max-height: 92svh;
      overflow: auto;
      background: #fff;

<script>
const APP = {
  token:'', user:null, setup:{}, depts:[], usersLite:[], meetings:[],
  dashboard:null, currentScreen:'calendar', dashPeriod:'week',
  filters:{kw:'', leader:'all', scope:'CURRENT', kind:'ALL'},
  summaryFilters:{range:'3DAYS', endDate:'', mode:'DAY_LEADER', format:'COMPACT', includeTruc:false, onlyPublished:true, includePlace:true, includeRole:true},
  manageFilters:{kw:'', leader:'all', scope:'CURRENT', kind:'ALL', status:'all'},
  loadedAll:false, pendingFormFiles:[], bootstrapReady:false, lastBootstrapAt:0, bootstrapSource:'none',
  libraryStack:[], libraryCurrentUrl:'', detailFiles:[], noteUploadQueue:[], notebook:{kw:'', notes:[], loaded:false},
  docsReport:{loaded:false,rows:[],stats:{},filters:null},
  duty:{inited:false, loaded:false, tab:'summary'}, backendVersion:''
};

// ===== PHÂN QUYỀN =====
// Sửa lịch: Lãnh đạo Chi cục, Lãnh đạo Phòng, Thư ký (ngoài Admin/SuperAdmin)
const ROLE_EDIT = ['SuperAdmin','Admin','LanhDaoCucChi','LanhDaoPhong','Thuky','Lanhdaophong','lanhdaophong','LanhdaoPhong','LanhDaocucchi','Lanhdaocucchi','LanhDaoTruong','LanhdaoTruong','lanhdao'];
const ROLE_ADMIN = ['SuperAdmin','Admin'];
const ROLE_EDIT_LABEL = {
  SuperAdmin:'Quản trị cao cấp', Admin:'Quản trị', Thuky:'Thư ký',
  LanhDaoCucChi:'Lãnh đạo Chi cục', LanhDaoPhong:'Lãnh đạo Phòng', Viewer:'Xem',
  Lanhdaophong:'Lãnh đạo Phòng', LanhdaoPhong:'Lãnh đạo Phòng', LanhDaocucchi:'Lãnh đạo Chi cục', Lanhdaocucchi:'Lãnh đạo Chi cục', LanhDaoTruong:'Lãnh đạo', LanhdaoTruong:'Lãnh đạo', lanhdao:'Lãnh đạo'
};

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function hasRole(list){
  if(!APP.user)return false;
  if(list.includes(APP.user.role))return true;
  // Fallback: khớp không phân biệt hoa thường
  const r=APP.user.role.toLowerCase();
  return list.some(x=>x.toLowerCase()===r);
}
const ROLE_NOTE_LDCC = ['LanhDaoCucChi','LanhDaocucchi','Lanhdaocucchi','lanhdaochicuc','lanhdaocucchi'];
function normNoteName(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d')
    .replace(/d\/c|dong chi/g,' ')
    .replace(/[-–—].*$/g,' ')
    .replace(/\([^)]*\)/g,' ')
    .replace(/[^a-z0-9]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function isSuperAdmin(){return hasRole(['SuperAdmin']);}
function isLanhDaoChiCuc(){return hasRole(ROLE_NOTE_LDCC);}
function isCurrentUserChair(m){
  if(!APP.user||!m)return false;
  const chair=normNoteName(m.chuTri||'');
  if(!chair)return false;
  const names=[APP.user.fullname,APP.user.username,APP.user.id].map(normNoteName).filter(Boolean);
  return names.some(n=>n && (chair.includes(n)||n.includes(chair)));
}
function canUseMeetingNote(m){
  // V52: mọi tài khoản đã đăng nhập đều thấy nút Note và được ghi note theo lịch.
  // Note vẫn là riêng tư cá nhân: ai tạo thì chỉ người đó xem/sửa/xóa.
  return !!(APP && APP.user && APP.user.username);
}

const ROLE_PREP_RATING = [
  'SuperAdmin','Admin','useradmin','UserAdmin','QuanTri','QuanTriHeThong','Quản trị hệ thống','Quản trị cao cấp',
  'LanhDaoCucChi','LanhDaocucchi','Lanhdaocucchi','lanhdaochicuc','lanhdaocucchi'
];
function canRatePrepClient(){
  if(hasRole(ROLE_PREP_RATING)) return true;
  const r = normText((APP.user && APP.user.role) || '');
  const u = normText((APP.user && APP.user.username) || '');
  const fn = normText((APP.user && APP.user.fullname) || '');
  return /superadmin|admin|useradmin|quan tri|lanh dao chi cuc|lanhdaochicuc|lanhdaocucchi/.test(r+' '+u+' '+fn);
}
function prepRatingStarsHtml(m, context='card'){
  if(!m || !m.showPrepRating) return '';

  // Cho phép bấm nếu server cho phép hoặc client nhận diện là Admin/SuperAdmin/useradmin/Lãnh đạo Chi cục.
  // Cách này tránh trường hợp tên role trong sheet khác biến thể làm sao chỉ hiện mờ nhưng không bấm được.
  const canRate = !!m.canRatePrep || canRatePrepClient();
  const score = Math.max(0, Math.min(5, Number(m.prepRatingVisibleScore)||0));
  const count = Number(m.publicPrepRatingCount)||0;
  const title = score
    ? `Đánh giá chuẩn bị tài liệu: ${score}/5 sao${count?` (${count} lượt đánh giá)`:''}${canRate?' - bấm để chấm/cập nhật':''}`
    : 'Chưa đánh giá chất lượng chuẩn bị hồ sơ tài liệu';

  return `<span class="prep-rating prep-rating-${esc(context)} ${canRate?'':'readonly'}" data-meeting-id="${esc(m.meetingId)}" data-score="${score}" title="${esc(title)}">
    ${[1,2,3,4,5].map(n=>canRate
      ? `<button type="button" class="star ${n<=score?'on':''}" data-score="${n}" aria-label="${n} sao">★</button>`
      : `<span class="star ${n<=score?'on':''}" aria-hidden="true">★</span>`
    ).join('')}
  </span>`;
}

const PREP_RATING_SAVE = Object.create(null);
function getPrepRatingScore(meetingId){
  const id = String(meetingId||'');
  const fromData = (APP.meetings||[]).concat(APP.allMeetings||[]).find(m=>String(m.meetingId)===id);
  if(fromData) return Math.max(0, Math.min(5, Number(fromData.prepRatingVisibleScore || fromData.myPrepRating || fromData.publicPrepRating)||0));
  const box = document.querySelector(`.prep-rating[data-meeting-id="${CSS.escape(id)}"]`);
  return box ? Math.max(0, Math.min(5, Number(box.dataset.score)||0)) : 0;
}
function markPrepRatingSaving(meetingId, saving){
  const id = String(meetingId||'');
  document.querySelectorAll(`.prep-rating[data-meeting-id="${CSS.escape(id)}"]`).forEach(box=>{
    box.classList.toggle('saving', !!saving);
    box.setAttribute('aria-busy', saving ? 'true' : 'false');
    if(saving) box.title = 'Đã đổi sao trên giao diện, đang lưu ngầm...';
  });
}
async function flushPrepRatingSave(meetingId){
  const id = String(meetingId||'');
  const st = PREP_RATING_SAVE[id];
  if(!st || st.saving) return;
  const score = Math.max(1, Math.min(5, Number(st.pending)||0));
  if(!score){ markPrepRatingSaving(id, false); return; }
  st.pending = null;
  st.saving = true;
  markPrepRatingSaving(id, true);
  try{
    const res = await api('setMeetingRating',{meetingId:id, score});
    const savedScore = Math.max(1, Math.min(5, Number(res.score)||score));
    st.lastGood = savedScore;
    updateLocalMeetingRating(id, savedScore);
    paintPrepRatingDom(id, savedScore);
    // Không gọi getMeetings/refreshAll/render lại toàn bộ. Các màn hình đang mở giữ nguyên trạng thái nhanh.
    msgToast(res.msg || ('Đã lưu đánh giá '+savedScore+' sao.'));
  }catch(e){
    // Chỉ hoàn tác nếu người dùng chưa bấm mức mới trong lúc request đang chạy.
    if(!st.pending){
      const back = Math.max(0, Math.min(5, Number(st.lastGood)||0));
      updateLocalMeetingRating(id, back);
      paintPrepRatingDom(id, back);
      msgToastError('Chưa lưu được đánh giá sao: '+((e&&e.message)||String(e||'')));
    }
  }finally{
    st.saving = false;
    if(st.pending){
      setTimeout(()=>flushPrepRatingSave(id), 0);
    }else{
      markPrepRatingSaving(id, false);
    }
  }
}

function updateLocalMeetingRating(meetingId, score){
  const apply = (m)=>{
    if(String(m.meetingId)!==String(meetingId)) return;
    const s = Math.max(0, Math.min(5, Number(score)||0));
    m.myPrepRating = s;
    m.publicPrepRating = s;
    m.prepRatingVisibleScore = s;
    m.showPrepRating = true;
    m.canRatePrep = true;
    m.publicPrepRatingCount = Math.max(1, Number(m.publicPrepRatingCount)||0);
  };
  (APP.meetings||[]).forEach(apply);
  (APP.allMeetings||[]).forEach(apply);
}
function paintPrepRatingDom(meetingId, score){
  const s = Math.max(0, Math.min(5, Number(score)||0));
  document.querySelectorAll(`.prep-rating[data-meeting-id="${CSS.escape(String(meetingId))}"]`).forEach(box=>{
    box.dataset.score = String(s);
    box.classList.remove('readonly');
    box.querySelectorAll('.star').forEach((st,idx)=>st.classList.toggle('on', idx < s));
  });
}
function setPrepRating(ev, meetingId, score){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  meetingId = String(meetingId||'').trim();
  score = Math.max(1, Math.min(5, Number(score)||0));
  if(!meetingId || !score) return;

  // Optimistic UI: sao sáng ngay, không chờ Apps Script lưu xong.
  const oldScore = getPrepRatingScore(meetingId);
  const st = PREP_RATING_SAVE[meetingId] || (PREP_RATING_SAVE[meetingId] = {
    lastGood: oldScore,
    pending: null,
    saving: false,
    timer: null
  });
  if(!st.lastGood) st.lastGood = oldScore;

  st.pending = score;
  paintPrepRatingDom(meetingId, score);
  updateLocalMeetingRating(meetingId, score);
  markPrepRatingSaving(meetingId, true);

  if(st.timer) clearTimeout(st.timer);
  st.timer = setTimeout(()=>flushPrepRatingSave(meetingId), 180);
}

const CLIENT_SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000;
const CLIENT_SESSION_TOKEN_KEY_ = 'lct_token';
const CLIENT_SESSION_USER_KEY_ = 'lct_user';
const CLIENT_SESSION_SAVED_KEY_ = 'lct_session_saved_at';
const BOOTSTRAP_SNAPSHOT_KEY_ = 'lct_bootstrap_snapshot_v170';
const BOOTSTRAP_SNAPSHOT_MAX_AGE_MS_ = 6 * 60 * 60 * 1000;

function saveClientSession_(token, user) {
  const now = String(Date.now());
  const userRaw = JSON.stringify(user || {});
  try {
    sessionStorage.setItem(CLIENT_SESSION_TOKEN_KEY_, token || '');
    sessionStorage.setItem(CLIENT_SESSION_USER_KEY_, userRaw);
    sessionStorage.setItem(CLIENT_SESSION_SAVED_KEY_, now);
  } catch(e) {}
  // LocalStorage giúp PWA/tab bị trình duyệt giải phóng vẫn khôi phục phiên; server vẫn kiểm tra TTL 12 giờ.
  try {
    localStorage.setItem(CLIENT_SESSION_TOKEN_KEY_, token || '');
    localStorage.setItem(CLIENT_SESSION_USER_KEY_, userRaw);
    localStorage.setItem(CLIENT_SESSION_SAVED_KEY_, now);
  } catch(e) {}
}

function clearClientSession_() {
  [sessionStorage, localStorage].forEach(function(store){
    try {
      store.removeItem(CLIENT_SESSION_TOKEN_KEY_);
      store.removeItem(CLIENT_SESSION_USER_KEY_);
      store.removeItem(CLIENT_SESSION_SAVED_KEY_);
      if (store === sessionStorage) store.removeItem(BOOTSTRAP_SNAPSHOT_KEY_);
    } catch(e) {}
  });
}

function restoreClientSession_() {
  const stores = [sessionStorage, localStorage];
  for (const store of stores) {
    try {
      const token = store.getItem(CLIENT_SESSION_TOKEN_KEY_) || '';
      const userRaw = store.getItem(CLIENT_SESSION_USER_KEY_) || '';
      const savedAt = Number(store.getItem(CLIENT_SESSION_SAVED_KEY_) || 0);
      if (!token || !userRaw) continue;
      if (savedAt && Date.now() - savedAt > CLIENT_SESSION_MAX_AGE_MS) continue;
      const user = JSON.parse(userRaw);
      if (user && (user.username || user.id)) {
        saveClientSession_(token, user); // đồng bộ lại cả hai storage.
        return { token, user };
      }
    } catch(e) {}
  }
  clearClientSession_();
  return null;
}

function makeApiError_(res, fallbackCode) {
  const e = new Error((res && res.msg) || 'Lỗi không xác định');
  e.code = (res && res.code) || fallbackCode || 'SERVER_ERROR';
  e.retryable = !!(res && res.retryable);
  e.errorId = res && res.errorId;
  return e;
}

function isAuthError_(e) {
  const code = String(e && e.code || '');
  if (/^AUTH_(?:REQUIRED|EXPIRED|INVALID|DISABLED)$/.test(code)) return true;
  const msgText = String(e && e.message || '').toLowerCase();
  return /phiên đăng nhập.*hết hạn|phiên đăng nhập.*không còn hiệu lực|chưa đăng nhập/.test(msgText);
}

function isTransientApiError_(e) {
  const code = String(e && e.code || '');
  return /^(?:NETWORK_TIMEOUT|NETWORK_ERROR|SERVER_BUSY|SERVER_ERROR)$/.test(code) || !!(e && e.retryable);
}

const MAX_UPLOAD_SIZE = 50 * 1024 * 1024; // 50MB/file
const ALLOWED_UPLOAD_EXT = new Set(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','csv','jpg','jpeg','png','gif','webp','zip','rar','7z']);
const BLOCKED_UPLOAD_EXT = new Set(['exe','msi','bat','cmd','com','scr','ps1','vbs','js','jar','html','htm','php','asp','aspx','jsp']);
function getFileExt(name){
  const s=String(name||'').toLowerCase();
  const p=s.lastIndexOf('.');
  return p>=0?s.slice(p+1):'';
}
function validateUploadFile(file){
  if(!file) throw new Error('Không có file để upload.');
  const ext=getFileExt(file.name);
  if(file.size > MAX_UPLOAD_SIZE) throw new Error('File "'+file.name+'" vượt quá giới hạn 50MB.');
  if(BLOCKED_UPLOAD_EXT.has(ext) || !ALLOWED_UPLOAD_EXT.has(ext)) throw new Error('Định dạng file "'+file.name+'" chưa được phép upload. Chỉ nhận PDF, Office, ảnh, text/csv và file nén.');
  return true;
}
function filterValidUploadFiles(files){
  const arr=Array.from(files||[]);
  arr.forEach(validateUploadFile);
  return arr;
}

function canUseGoogleScriptRun(){

function apiViaGoogleScriptRun(payload){
  return new Promise((resolve,reject)=>{
    try{
      google.script.run
        .withSuccessHandler(res=>{
          if(!res || res.ok===false) reject(makeApiError_(res));
          else resolve(res);
        })
        .withFailureHandler(err=>{
          const e=new Error((err&&err.message)||String(err||'Lỗi gọi Apps Script'));
          e.code='NETWORK_ERROR'; e.retryable=true; reject(e);
        })
        .api(payload);
    }catch(err){
      const e=new Error((err&&err.message)||String(err)); e.code='NETWORK_ERROR'; e.retryable=true; reject(e);
    }
  });
}
function apiViaHiddenUploadPost(payload){
  // Dùng form POST + hidden iframe để upload từ GitHub Pages/trang ngoài mà không phụ thuộc CORS.
  // Không đọc được JSON trả về do khác domain, nên coi là đã gửi sau khi form submit thành công và tải lại thư mục sau vài giây.
  return new Promise((resolve,reject)=>{
    try{
      if(!GAS_URL) throw new Error('Thiếu GAS_URL để gửi upload.');
      const iframeName='gasUploadFrame_'+Date.now()+Math.random().toString(36).slice(2);
      const iframe=document.createElement('iframe');
      iframe.name=iframeName;
      iframe.style.cssText='position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;border:0;';
      const form=document.createElement('form');
      form.method='POST';
      form.action=GAS_URL;
      form.target=iframeName;
      form.enctype='application/x-www-form-urlencoded';
      form.acceptCharset='UTF-8';
      form.style.display='none';
      const input=document.createElement('input');
      input.type='hidden';
      input.name='payload';
      input.value=JSON.stringify(payload);
      form.appendChild(input);
      document.body.appendChild(iframe);
      document.body.appendChild(form);
      let settled=false;
      const cleanup=()=>setTimeout(()=>{try{form.remove();iframe.remove();}catch(_){ }},2500);
      iframe.onload=()=>{
        if(settled)return;
        settled=true;
        cleanup();
        resolve({ok:true,msg:'Đã gửi yêu cầu upload tới Apps Script.'});
      };
      form.submit();
      setTimeout(()=>{
        if(settled)return;
        settled=true;
        cleanup();
        resolve({ok:true,msg:'Đã gửi yêu cầu upload tới Apps Script; đang chờ Drive xử lý.'});
      },4200);
    }catch(e){ reject(e); }
  });
}
const API_READ_DEDUP_ACTIONS = new Set([
  'getBootstrap','getSetup','getDepts','getMeetings','getDashboard','getVersion',
  'getUnreadNoteCount','getLeaderScheduleCard','getMeetingDocsReport','getDutyData',
  'getNotes','getUsers','getLogs','libraryListFolder','librarySearchFiles'
]);
const __apiReadInflight_ = new Map();

function api(action, payload={}) {
  const requestPayload = Object.assign({}, payload, { action: action, token: APP.token });
  const canDedup = API_READ_DEDUP_ACTIONS.has(action);
  const dedupKey = canDedup ? action + '|' + JSON.stringify(requestPayload) : '';
  if (canDedup && __apiReadInflight_.has(dedupKey)) return __apiReadInflight_.get(dedupKey);

  const rawRequest = (canDedup ? apiReadRequestWithRetry_(action, requestPayload) : apiRequestRaw_(action, requestPayload));
  const request = rawRequest.catch(err => {
    // Chỉ lỗi xác thực thật sự mới đưa về màn hình đăng nhập. Timeout/mạng/server chậm giữ nguyên phiên.
    if (action !== 'login' && isAuthError_(err)) {
      showLogin({ clearSession: true, reason: err.message });
    }
    throw err;
  });
  if (!canDedup) return request;

  const tracked = request.finally(() => {
    if (__apiReadInflight_.get(dedupKey) === tracked) __apiReadInflight_.delete(dedupKey);
  });
  __apiReadInflight_.set(dedupKey, tracked);
  return tracked;
}


function delay_(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function apiReadRequestWithRetry_(action,payload){
  try{return await apiRequestRaw_(action,payload);}
  catch(e){
    // Chỉ retry lỗi tải script/đường truyền tức thời. Không retry timeout vì execution cũ
    // có thể vẫn chạy trên Apps Script; tránh nhân đôi tải backend.
    if(String(e&&e.code||'')!=='NETWORK_ERROR')throw e;
    await delay_(900);
    return apiRequestRaw_(action,payload);
  }
}

function apiRequestRaw_(action, payload) {
  if (canUseGoogleScriptRun()) return apiViaGoogleScriptRun(payload);

  if (['uploadMeetingFile','uploadLibraryFile','uploadNoteFile'].includes(action) || (action==='saveNote' && payload.uploadId)) {
    return apiViaHiddenUploadPost(payload);
  }

  return new Promise((resolve, reject) => {
    const cbName = '_cb_' + Date.now() + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timeoutMs = (action === 'login' ? 25000 : (action === 'librarySearchFiles' || action === 'getMeetingDocsReport' ? 120000 : 45000));
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup(true);
      const e=new Error('Timeout — Apps Script chưa phản hồi. Phiên đăng nhập vẫn được giữ; hãy thử tải lại.'); e.code='NETWORK_TIMEOUT'; e.retryable=true; reject(e);
    }, timeoutMs);

    function cleanup(keepLateSink) {
      clearTimeout(timer);
      if (keepLateSink) {
        // Hấp thụ callback đến muộn để tránh ReferenceError; tự dọn sau 60 giây.
        window[cbName] = function(){};
        setTimeout(() => { try { delete window[cbName]; } catch(e){} }, 60000);
      } else {
        try { delete window[cbName]; } catch(e) {}
      }
      if (script && script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(res) {
      if (settled) return;
      settled = true;
      cleanup(false);
      if (!res || res.ok === false) reject(makeApiError_(res));
      else resolve(res);
    };
    const qs = new URLSearchParams({ data: JSON.stringify(payload), callback: cbName, _ts: Date.now().toString() });
    script.src = GAS_URL + '?' + qs.toString();
    script.async = true;
    script.onerror = function() {
      if (settled) return;
      settled = true;
      cleanup(false);

    };

// ===== V124: cache nhẹ trong phiên trình duyệt để Notebook/TVVB mở nhanh hơn =====
function fastCacheHash(s){
  s=String(s||'');
  let h=0;
  for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
  return Math.abs(h).toString(36);
}
function fastCacheKey(prefix, payload){
  return 'lct_fast_'+prefix+'_'+fastCacheHash(JSON.stringify(payload||{}));
}
function fastCacheGet(prefix, payload, ttlMs){
  try{
    const raw=sessionStorage.getItem(fastCacheKey(prefix,payload));
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(!obj || !obj.t || (Date.now()-obj.t)>(ttlMs||300000)) return null;
    return obj.v || null;
  }catch(e){ return null; }
}
function fastCacheSet(prefix, payload, value){
  try{ sessionStorage.setItem(fastCacheKey(prefix,payload), JSON.stringify({t:Date.now(),v:value})); }catch(e){}
}
function fastCacheClearPrefix(prefix){
  try{
    const p='lct_fast_'+prefix+'_';
    Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf(p)===0) sessionStorage.removeItem(k); });
  }catch(e){}
}
async function waitUploadStatus(uploadId, fileName){
  const deadline = Date.now() + 30000;
  let lastMsg = '';
  while(Date.now() < deadline){
    await sleep(1500);
    try{
      const st = await api('getUploadStatus',{uploadId});
      if(st && !st.pending){
        if(st.ok === false) throw new Error(st.msg || ('Upload lỗi: '+(fileName||'')));
        return st;
      }
      lastMsg = (st && st.msg) || lastMsg;
    }catch(e){
      const msg = (e && e.message) || String(e || '');
      if(/Action không hợp lệ|getUploadStatus/i.test(msg)){
        throw new Error('Web App đang chạy bản cũ, chưa có getUploadStatus/uploadLibraryFile. Cần Deploy lại bằng New version rồi cập nhật GAS_URL nếu đổi deployment.');
      }
      lastMsg = msg;
    }
  }
  throw new Error('Chưa nhận được phản hồi upload từ Web App sau 30 giây. Khả năng cao là form POST bị chặn hoặc Web App chưa Deploy phiên bản mới. ' + (lastMsg ? 'Thông tin cuối: '+lastMsg : ''));
}

let __dragGuardInstalled=false;
function isFileDragEvent(ev){
  const dt=ev && ev.dataTransfer;
  if(!dt)return false;
  const types=Array.from(dt.types||[]).map(x=>String(x));
  return types.indexOf('Files')>=0 || types.indexOf('application/x-moz-file')>=0;
}
function findLibraryDropzone(ev){
  return ev && ev.target && ev.target.closest ? ev.target.closest('.library-dropzone') : null;
}
function installUploadDragGuards(){
  if(__dragGuardInstalled)return;
  __dragGuardInstalled=true;

  // Bắt sự kiện ở capture phase để vùng input file trong suốt không nuốt mất thao tác kéo-thả.
  ['dragenter','dragover'].forEach(type=>{
    document.addEventListener(type, ev=>{
      if(!isFileDragEvent(ev))return;
      const zone=findLibraryDropzone(ev);
      if(zone){
        ev.preventDefault();
        ev.stopPropagation();
        try{ev.dataTransfer.dropEffect='copy';}catch(_){ }
        zone.classList.add('drag');
        return;
      }
      const otherDrop=ev.target && ev.target.closest && ev.target.closest('.drop');
      if(otherDrop)return; // để nguyên vùng upload tài liệu cuộc họp xử lý riêng
      ev.preventDefault();
    }, true);
  });

  document.addEventListener('dragleave', ev=>{
    const zone=findLibraryDropzone(ev);
    if(!zone)return;
    const to=ev.relatedTarget;
    if(to && zone.contains(to))return;
    zone.classList.remove('drag');
  }, true);

  document.addEventListener('drop', ev=>{
    if(!isFileDragEvent(ev))return;
    const zone=findLibraryDropzone(ev);
    if(zone){
      ev.preventDefault();
      ev.stopPropagation();
      zone.classList.remove('drag');
      const folderId=zone.getAttribute('data-folder-id')||'';
      const files=ev.dataTransfer ? ev.dataTransfer.files : null;
      if(!files || !files.length){
        librarySetUploadMsg(zone,'Không nhận được file. Hãy kéo file từ máy tính vào vùng này, hoặc bấm vào vùng upload để chọn file. Nếu kéo từ Google Drive/trình duyệt thì trình duyệt không truyền file thật để upload.','err');
        return;
      }
      libraryUploadToFolder(folderId, files, zone);
      return;
    }
    const otherDrop=ev.target && ev.target.closest && ev.target.closest('.drop');
    if(otherDrop)return;
    ev.preventDefault();
  }, true);
}

function dateVN(iso){
  if(!iso)return'';
  const s=String(iso).trim();
  const m1=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m1)return`${m1[3].padStart(2,'0')}/${m1[2].padStart(2,'0')}/${m1[1]}`;
  try{const dt=new Date(s);if(!isNaN(dt.getTime()))return`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;}catch(e){}

function toHHmm(v){
  let s=String(v||'').trim();
  if(!s)return'';
  s=s.toLowerCase().replace(/giờ/g,'h').replace(/[：.]/g,':').replace(/\s+/g,' ').trim();
  const isPm=/\bpm\b|\bch\b/.test(s), isAm=/\bam\b|\bsa\b/.test(s);
  s=s.replace(/\b(am|pm|sa|ch)\b/g,'').trim();
  let m=s.match(/^(\d{1,2})\s*[h:]\s*(\d{1,2})(?::\d{1,2})?$/) || s.match(/^(\d{1,2})(\d{2})$/);
  if(m){let hh=Number(m[1]), mm=Number(m[2]); if(isPm&&hh<12)hh+=12; if(isAm&&hh===12)hh=0; if(hh>=0&&hh<24&&mm>=0&&mm<60)return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
  m=s.match(/^(\d{1,2})$/);
  if(m){let hh=Number(m[1]); if(isPm&&hh<12)hh+=12; if(isAm&&hh===12)hh=0; if(hh>=0&&hh<24)return String(hh).padStart(2,'0')+':00';}
  return'';
}
function requireHHmm(inputId,label){
  const el=$(inputId); const val=toHHmm(el?.value||'');
  if(!val){ if(el)el.focus(); throw new Error(label+' không đúng định dạng. Vui lòng nhập HH:mm, ví dụ 14:45 hoặc 14h45.'); }
  if(el)el.value=val;
  return val;
}


function compactText(s){return normText(s).replace(/\s+/g,'')}
function levenshteinWithin(a,b,maxDist){
  a=String(a||''); b=String(b||'');
  if(a===b)return true;
  if(!a||!b)return false;
  if(Math.abs(a.length-b.length)>maxDist)return false;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let cur=[i], rowMin=cur[0];
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      const val=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      cur[j]=val; if(val<rowMin)rowMin=val;
    }
    if(rowMin>maxDist)return false;
    prev=cur;
  }
  return prev[b.length]<=maxDist;
}
function fuzzyTokenMatch(qt,hTokens){
  if(!qt)return true;
  if(qt.length===1)return hTokens.some(t=>t[0]===qt);
  const maxDist=qt.length<=4?1:(qt.length<=8?2:3);
  return hTokens.some(t=>{
    if(!t)return false;
    if(t===qt||t.includes(qt)||qt.includes(t))return true;
    if(t[0]!==qt[0])return false;
    return levenshteinWithin(qt,t,maxDist);
  });
}
function smartMatch(haystack,query){
  // Tìm kiếm lịch theo hướng CHÍNH XÁC HƠN:
  // - Không phân biệt hoa/thường, có dấu/không dấu.
  // - Tách nhiều từ khóa; TẤT CẢ từ khóa phải có trong dữ liệu.
  // - Không dùng fuzzy/Levenshtein để tránh nhập "Phạm Quốc Hưng" nhưng lôi nhầm lịch khác.
  const h=normText(haystack);
  const q=normText(query);
  if(!q)return true;
  const tokens=q.split(' ').filter(x=>x.length>0);
  if(!tokens.length)return true;
  return tokens.every(t=>h.includes(t));
}

function meetingLeaderHaystack(m){

// V160: single-flight + stale-response guard cho bootstrap.
let __bootstrapInflight_ = null;
let __bootstrapSeq_ = 0;

async function refreshAll(options){
  options=options||{};
  if(__bootstrapInflight_)return __bootstrapInflight_;
  const mySeq=++__bootstrapSeq_;
  const startToken=APP.token;

  // Khôi phục ảnh chụp dữ liệu trong cùng tab trước khi gọi mạng, giúp mở lại nhanh
  // và không trắng màn hình khi Apps Script tạm chậm.
  if(!hasUsableBootstrapData_()){
    const snap=loadBootstrapSnapshot_();
    if(snap){
      await applyBootstrapPayload_(snap,'session-cache',false);
      showCachedDataNotice_();
    }else setLoading();
  }else if(!options.preserveView && options.forceBlocking) setLoading();

  const flight=(async()=>{
    try{
      const res=await api('getBootstrap');
      if(mySeq!==__bootstrapSeq_||APP.token!==startToken)return res;
      saveBootstrapSnapshot_(res);
      await applyBootstrapPayload_(res,'live',!!options.skipRender);
      return res;
    }catch(e){
      if(isAuthError_(e))throw e;
      // Không xóa dữ liệu đã có. Lỗi mạng/cold start chỉ làm mất lượt làm mới,
      // không làm người dùng bị màn hình trắng hoặc mất Lịch 3 ngày.
      if(hasUsableBootstrapData_()){
        if(!options.skipRender)await render();
        showCachedDataNotice_();
        return {ok:true,offlineFallback:true,meetings:APP.meetings};
      }
      const snap=loadBootstrapSnapshot_();
      if(snap){
        await applyBootstrapPayload_(snap,'session-cache',!!options.skipRender);
        showCachedDataNotice_();
        return {ok:true,offlineFallback:true,meetings:APP.meetings};
      }
      throw e;
    }
  })();

  __bootstrapInflight_=flight;
  try{return await flight;}
  finally{if(__bootstrapInflight_===flight)__bootstrapInflight_=null;}
}

function endDateByRange_(range){const today=new Date();today.setHours(0,0,0,0);const d=new Date(today);if(range==='TODAY')return d;if(range==='TOMORROW'){d.setDate(d.getDate()+1);return d;}if(range==='3DAYS'){d.setDate(d.getDate()+2);return d;}if(range==='MONTH')return new Date(today.getFullYear(),today.getMonth()+1,0);const day=today.getDay()||7;d.setDate(today.getDate()+(7-day));return d;}

function isPublishedForSummary_(m){const st=String(m.trangThai||m.status||'').toUpperCase();return !st||st==='PUBLISHED'||st==='COMPLETED'||st==='ACTIVE'||st==='DA_DUYET'||st==='ĐÃ DUYỆT';}

function summaryMeetings_(){const f=APP.summaryFilters||{};const today=new Date();today.setHours(0,0,0,0);const end=summaryEndDate_();const src=APP.meetings||[];return(src||[]).filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;if(!s||!e)return false;if(e<today||s>end)return false;if(!f.includeTruc&&(isTrucBanMeeting(m)||isGiaoBanMeeting(m)))return false;if(f.onlyPublished!==false&&!isPublishedForSummary_(m)&&!isDraftForSummary_(m))return false;if(String(m.trangThai||'').toUpperCase()==='CANCELLED')return false;return true;}).sort((a,b)=>dateKey_(a.ngayBatDau)-dateKey_(b.ngayBatDau)||String(a.gioBatDau||'').localeCompare(String(b.gioBatDau||''))||String(a.meetingId||'').localeCompare(String(b.meetingId||'')));}
function summaryLeaderIndex_(m){for(let i=0;i<SUMMARY_LEADERS.length;i++)if(matchLeaderExact(m,SUMMARY_LEADERS[i].name))return i;return 99;}

function summaryPeriodKey_(m){const t=String(m.gioBatDau||'').trim();if(!t)return'ALLDAY';const h=parseInt(t.split(':')[0],10);if(isNaN(h))return'ALLDAY';if(h<12)return'MORNING';if(h<18)return'AFTERNOON';return'EVENING';}
function summaryPeriodLabel_(key){return({ALLDAY:'CẢ NGÀY',MORNING:'BUỔI SÁNG',AFTERNOON:'BUỔI CHIỀU',EVENING:'BUỔI TỐI'}[key]||'LỊCH KHÁC');}
function cleanLeaderRole_(s){return String(s||'').replace(/^Đ\/c\s*/i,'Đ/c ').replace(/Phó\s+Chi\s+cục\s+trưởng/gi,'PCCT').replace(/Phó\s+CCT/gi,'PCCT').replace(/Chi\s+cục\s+trưởng/gi,'CCT').replace(/\s+/g,' ').trim();}

function summaryMeetingLines_(m,opt){
  opt=opt||{};const f=APP.summaryFilters||{};const full=f.format==='FULL';
  const time=summaryCleanText_(m.gioBatDau)||'Cả ngày';
  const action=summaryCleanText_(m.noiDung).replace(/[.!?…]+$/,'');
  const place=f.includePlace===false?'':summaryCleanText_(m.diaDiem);
  const leader=opt.withLeader?meetingLeaderForLine_(m):'';
  const draft=summaryDraftSuffix_(m);
  if(!full){
    let line='- '+time;
    if(leader)line+=' | '+leader;
    line+=' – '+action+draft;
    if(place)line+=' • '+place;
    return[line.trim()];
  }
  const lines=[];
  if(leader){lines.push('- '+time+' | '+leader);lines.push('  '+action+draft);}
  else lines.push('- '+time+' – '+action+draft);
  if(place)lines.push('  Địa điểm: '+place);

function summaryTitleByRange_(range){range=range||'3DAYS';if(range==='TODAY')return'TÓM TẮT LỊCH HÔM NAY';if(range==='TOMORROW')return'TÓM TẮT LỊCH NGÀY MAI';if(range==='3DAYS')return'TÓM TẮT LỊCH 03 NGÀY';if(range==='WEEK')return'TÓM TẮT LỊCH ĐẾN HẾT TUẦN';if(range==='MONTH')return'TÓM TẮT LỊCH ĐẾN HẾT THÁNG';return'TÓM TẮT LỊCH';}
function summaryRangeCaption_(){
  const start=new Date();start.setHours(0,0,0,0);const end=summaryEndDate_();
  const dd=d=>String(d.getDate()).padStart(2,'0'),mm=d=>String(d.getMonth()+1).padStart(2,'0');
  if(start.getFullYear()===end.getFullYear()&&start.getMonth()===end.getMonth()){
    if(start.getDate()===end.getDate())return dd(start)+'/'+mm(start)+'/'+start.getFullYear();
    return dd(start)+'–'+dd(end)+'/'+mm(end)+'/'+end.getFullYear();
  }
  if(start.getFullYear()===end.getFullYear())return dd(start)+'/'+mm(start)+'–'+dd(end)+'/'+mm(end)+'/'+end.getFullYear();
  return dd(start)+'/'+mm(start)+'/'+start.getFullYear()+'–'+dd(end)+'/'+mm(end)+'/'+end.getFullYear();
}
function buildSummaryText(){const arr=summaryMeetings_();const f=APP.summaryFilters||{};const title=summaryTitleByRange_(f.range||'3DAYS')+' ('+summaryRangeCaption_()+')';if(!arr.length)return title+'\n\nKhông có lịch phù hợp trong khoảng thời gian đã chọn.';return f.mode==='LEADER'?buildSummaryByLeader_(arr,title):buildSummaryByDay_(arr,title);}
function buildSummaryByLeader_(arr,title){
  const keys=['hung','duong','loi','thang','other'];const group={hung:[],duong:[],loi:[],thang:[],other:[]};
  arr.forEach(m=>(group[summaryLeaderKey_(m)]||group.other).push(m));
  const blocks=[];let no=0;
  keys.forEach(key=>{
    const list=group[key]||[];if(!list.length)return;no++;
    const lines=[no+'. '+summaryLeaderDisplay_(summaryLeaderLabelByKey_(key))];
    const byDate={};list.forEach(m=>{const k=summaryDateKey_(m);(byDate[k]||(byDate[k]=[])).push(m);});
    Object.keys(byDate).sort().forEach(date=>{
      lines.push(summaryDateTitle_(date,true));
      byDate[date].sort((a,b)=>String(a.gioBatDau||'').localeCompare(String(b.gioBatDau||''))).forEach(m=>lines.push(...summaryMeetingLines_(m,{withLeader:false})));
    });
    blocks.push(lines.join('\n'));
  });
  return title+'\n\n'+blocks.join('\n\n');
}
function buildSummaryByDay_(arr,title){
  const byDate={};arr.forEach(m=>{const k=summaryDateKey_(m);(byDate[k]||(byDate[k]=[])).push(m);});
  const dateBlocks=[];const periodOrder=['ALLDAY','MORNING','AFTERNOON','EVENING'];
  Object.keys(byDate).sort().forEach(date=>{
    const lines=[summaryDateTitle_(date,false).toUpperCase(),''];
    const periods={ALLDAY:[],MORNING:[],AFTERNOON:[],EVENING:[]};
    byDate[date].forEach(m=>(periods[summaryPeriodKey_(m)]||periods.ALLDAY).push(m));
    const periodBlocks=[];
    periodOrder.forEach(pk=>{
      const list=periods[pk]||[];if(!list.length)return;
      const pLines=[summaryPeriodLabel_(pk)];
      list.sort((a,b)=>String(a.gioBatDau||'').localeCompare(String(b.gioBatDau||''))||summaryLeaderIndex_(a)-summaryLeaderIndex_(b)).forEach(m=>pLines.push(...summaryMeetingLines_(m,{withLeader:true})));
      periodBlocks.push(pLines.join('\n'));

    lines.push(periodBlocks.join('\n\n'));dateBlocks.push(lines.join('\n'));
  });
  return title+'\n\n'+dateBlocks.join('\n\n');
}

function leaderCardTodayIso_(){const d=new Date();d.setHours(0,0,0,0);return dateInputValue_(d);}
function leaderCardEnsureState_(){
  if(!APP.leaderCard) APP.leaderCard={startDate:leaderCardTodayIso_(),data:null,loading:false};
  return APP.leaderCard;
}
function leaderCardLocalLeaders_(){
  return [
    {key:'hung',label:'Đ/c Hưng',name:'Phạm Quốc Hưng'},
    {key:'duong',label:'Đ/c Dương',name:'Ngô Tùng Dương'},
    {key:'loi',label:'Đ/c Lợi',name:'Bùi Ngọc Lợi'},
    {key:'thang',label:'Đ/c Thắng',name:'Nguyễn Cảnh Thắng'}
  ];
}
function leaderCardLocalSessions_(m){
  const h1=parseInt(String(m.gioBatDau||'').split(':')[0],10);
  const h2=parseInt(String(m.gioKetThuc||'').split(':')[0],10);
  // Kết thúc đúng 12:00 vẫn là buổi sáng; chỉ gộp hai buổi khi thực sự vượt quá 12h.
  if(!isNaN(h1)&&h1<12&&!isNaN(h2)&&h2>12)return['SANG','CHIEU'];
  return[(!isNaN(h1)&&h1>=12)?'CHIEU':'SANG'];
}
function buildLeaderCardLocal_(dateFrom){
  const start=parseIsoDate(dateFrom)||new Date();start.setHours(0,0,0,0);
  const leaders=leaderCardLocalLeaders_();
  const days=[];
  for(let i=0;i<3;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);d.setHours(0,0,0,0);
    const row={date:dateInputValue_(d),thu:weekdayLabel({ngayBatDau:dateInputValue_(d)}),sessions:{SANG:{},CHIEU:{}}};
    leaders.forEach(ld=>{row.sessions.SANG[ld.key]=[];row.sessions.CHIEU[ld.key]=[];});
    days.push(row);
  }
  const src=(APP.allMeetings&&APP.allMeetings.length?APP.allMeetings:APP.meetings)||[];
  src.forEach(m=>{
    if(String(m.trangThai||'').toUpperCase()==='CANCELLED')return;
    const ms=parseIsoDate(m.ngayBatDau),me=parseIsoDate(m.ngayKetThuc||m.ngayBatDau);
    if(!ms||!me)return;ms.setHours(0,0,0,0);me.setHours(23,59,59,999);
    const sessions=leaderCardLocalSessions_(m);
    days.forEach(day=>{
      const ds=parseIsoDate(day.date);ds.setHours(0,0,0,0);const de=new Date(ds);de.setHours(23,59,59,999);
      if(me<ds||ms>de)return;
      leaders.forEach(ld=>{
        if(!matchLeaderExact(m,ld.name))return;
        sessions.forEach(sk=>day.sessions[sk][ld.key].push({
          meetingId:m.meetingId,noiDung:m.noiDung,diaDiem:m.diaDiem,fileCount:m.fileCount,
          gioBatDau:m.gioBatDau,gioKetThuc:m.gioKetThuc
        }));
      });
    });
  });
  return{ok:true,days,leaders,source:APP.bootstrapSource||'local'};
}

  LEADER_CARD_KEYS_.forEach(k=>(day.sessions[sessionKey][k]||[]).forEach(m=>items.push(m)));
  const withTime=items.find(m=>m.gioBatDau);
  if(!withTime) return null;
  return {start:esc(withTime.gioBatDau||''),end:esc(withTime.gioKetThuc||'')};
}
function leaderCardItemHtml_(m){

  </div>`;
}
function leaderCardCellHtml_(list){
  if(!list||!list.length) return '';
  return list.map(leaderCardItemHtml_).join('');
}
const LEADER_CARD_BG_={hung:'leader-bg-moc',duong:'leader-bg-tho',loi:'leader-bg-thuy',thang:'leader-bg-kim'};
function leaderCardIsFullDay_(m){
  const p1=String(m.gioBatDau||'').split(':').map(Number);
  const p2=String(m.gioKetThuc||'').split(':').map(Number);
  if(!Number.isFinite(p1[0])||!Number.isFinite(p2[0])) return false;
  const startMin=p1[0]*60+(Number.isFinite(p1[1])?p1[1]:0);
  const endMin=p2[0]*60+(Number.isFinite(p2[1])?p2[1]:0);
  // Kết thúc đúng 12:00 vẫn là buổi sáng; chỉ coi là xuyên buổi khi vượt quá 12:00.
  return startMin<12*60 && endMin>12*60;
}
// Bù trực tiếp trên frontend: lịch cả ngày (giờ bắt đầu <12h, giờ kết thúc >=12h)
// nhưng backend chỉ xếp vào 1 buổi (SANG) thì tự thêm vào buổi còn lại để gộp ô đúng,
// không phụ thuộc việc backend đã deploy bản mới hay chưa.
function leaderCardFillFullDay_(days,leaders){
  days.forEach(day=>{
    leaders.forEach(ld=>{
      const sang=day.sessions.SANG[ld.key]||(day.sessions.SANG[ld.key]=[]);
      const chieu=day.sessions.CHIEU[ld.key]||(day.sessions.CHIEU[ld.key]=[]);
      sang.filter(leaderCardIsFullDay_).forEach(m=>{
        if(!chieu.some(x=>x.meetingId===m.meetingId)) chieu.push(m);
      });
      chieu.filter(leaderCardIsFullDay_).forEach(m=>{
        if(!sang.some(x=>x.meetingId===m.meetingId)) sang.push(m);
      });
    });
  });
}
function leaderCardBuildPlans_(days,leaders){
  const slots=[];
  days.forEach(day=>['SANG','CHIEU'].forEach(sk=>slots.push({day,sk})));
  const plans={};
  leaders.forEach(ld=>{
    const plan=new Array(slots.length);
    let i=0;
    while(i<slots.length){
      const list=slots[i].day.sessions[slots[i].sk][ld.key]||[];
      if(list.length===1){
        const mid=list[0].meetingId;
        let j=i+1;
        while(j<slots.length){
          const list2=slots[j].day.sessions[slots[j].sk][ld.key]||[];
          if(list2.length===1&&list2[0].meetingId===mid) j++; else break;
        }
        plan[i]={span:j-i,list};
        for(let k=i+1;k<j;k++) plan[k]={skip:true};
        i=j;
      }else{
        plan[i]={span:1,list};
        i++;
      }
    }
    plans[ld.key]=plan;
  });
  return plans;
}

  const days=(st.data&&st.data.days)||[];
  const leaders=(st.data&&st.data.leaders)||LEADER_CARD_KEYS_.map(k=>({key:k,label:'Đ/c '+k}));
  leaderCardFillFullDay_(days,leaders);
  const plans=leaderCardBuildPlans_(days,leaders);
  const rows=days.map((day,di)=>{
    return ['SANG','CHIEU'].map((sk,si)=>{

        </td>`:'';
      const timeParts=leaderCardTimeParts_(day,sk);
      const timeHtml=timeParts?`<div class="lc-session-time"><span>${timeParts.start}</span>${timeParts.end?`<span class="lc-session-dash">—</span><span>${timeParts.end}</span>`:''}</div>`:'';
      const sessionCell=`<td class="lc-cell-session">
          <div class="lc-session-main">${leaderCardSessionLabel_(sk)}</div>
          ${timeHtml}
        </td>`;
      const leaderCells=leaders.map(ld=>{
        const cell=plans[ld.key][slotIdx];
        if(cell.skip) return '';
        const bg=LEADER_CARD_BG_[ld.key]||'';
        const merged=cell.span>1?' lc-cell-merged lc-cell-span2':'';
        const rs=cell.span>1?` rowspan="${cell.span}"`:'';
        return `<td class="${bg}${merged}"${rs}>${leaderCardCellHtml_(cell.list)}</td>`;
      }).join('');
      return `<tr>${dateCell}${sessionCell}${leaderCells}</tr>`;
    }).join('');
  }).join('');
  const headCells=leaders.map(ld=>`<th>${esc(ld.label)}</th>`).join('');
  return `<div class="leader-card-shell">
    ${toolbar}

          <div class="lc-heading-sub">Chi cục Hải quan khu vực VIII</div>
        </div>
        <div class="lc-heading-range">📅 ${esc(rangeText)}${APP.bootstrapSource==='session-cache'?' · dữ liệu gần nhất':''}</div>

    APP._loadingAll=true;
    api('getMeetings',{showPast:true,limit:5000}).then(res=>{
      APP.allMeetings=res.meetings||[];
      APP._loadingAll=false;
      renderDashboard();
    }).catch(()=>{APP._loadingAll=false;});
    // Hiển thị chú thích đang tải
  }
  const isFullData=!!APP.allMeetings;
  const nonTrucBan=meetings.filter(m=>m.loaiLich!=='TRUC_BAN');
  const tomorrowStart=new Date(now); tomorrowStart.setDate(now.getDate()+1); tomorrowStart.setHours(0,0,0,0);
  const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
  const countTomorrow=meetings.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=tomorrowEnd&&e>=tomorrowStart;}).length;
  const countWeek=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=wEnd&&e>=wStart;}).length;
  const countMonth=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=mEnd&&e>=mStart;}).length;
  const yStart=new Date(now.getFullYear(),0,1); const yEnd=new Date(now.getFullYear(),11,31,23,59,59,999);
  const countYear=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=yEnd&&e>=yStart;}).length;
  // Danh sách 4 lãnh đạo cố định theo thứ tự ưu tiên
  const LEADERS = [
    { name: 'Phạm Quốc Hưng',    display: 'Đ/c Phạm Quốc Hưng – Chi cục trưởng', short: 'Đ/c Hưng',  birthYear: 1973, menh: 'Mộc',  bgClass: 'leader-bg-moc' },
    { name: 'Ngô Tùng Dương',    display: 'Đ/c Ngô Tùng Dương', short: 'Đ/c Dương', birthYear: 1969, menh: 'Thổ',  bgClass: 'leader-bg-tho' },
    { name: 'Bùi Ngọc Lợi',      display: 'Đ/c Bùi Ngọc Lợi', short: 'Đ/c Lợi',   birthYear: 1974, menh: 'Thủy', bgClass: 'leader-bg-thuy' },
    { name: 'Nguyễn Cảnh Thắng', display: 'Đ/c Nguyễn Cảnh Thắng', short: 'Đ/c Thắng', birthYear: 1970, menh: 'Kim', bgClass: 'leader-bg-kim' },
  ];
  // Hàm chuẩn hoá: bỏ dấu, bỏ prefix "đ/c", "c ", chữ thường
  function normName(s){
    return String(s||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/đ/g,'d')
      .replace(/^(d\/c|c)\s+/,'')
      .replace(/\s*[-–]\s*.*/,'')   // bỏ phần sau gạch ngang (chức danh)
      .replace(/\s+/g,' ').trim();
  }
  const leaderMap={};
  LEADERS.forEach(l=>{ leaderMap[l.name]={...l,today:0,tomorrow:0,week:0,month:0,year:0}; });
  // Thống kê lãnh đạo tính cả lịch trực ban. Với lịch trực ban, tên lãnh đạo có thể nằm trong trường Thành phần.
  meetings.forEach(m=>{
    const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;
    if(!s)return;
    const raw=meetingLeaderHaystack(m);
    const parts=String(raw||'').split(/[,;\n]+/).map(x=>x.trim()).filter(x=>x.length>1);
    const matched=new Set();
    parts.forEach(part=>{
      const pn=normName(part);
      LEADERS.forEach(l=>{
        if(matched.has(l.name))return;
        if(pn===normName(l.name)||pn.includes(normName(l.name))||normName(l.name).includes(pn)){
          matched.add(l.name);
          const inToday=s<=now&&e>=now;
          const inTomorrow=s<=tomorrowEnd&&e>=tomorrowStart;
          const inWeek=s<=wEnd&&e>=wStart;

          if(inToday)leaderMap[l.name].today++;
          if(inTomorrow)leaderMap[l.name].tomorrow++;
          if(inWeek)leaderMap[l.name].week++;
          if(inMonth)leaderMap[l.name].month++;
          if(inYear)leaderMap[l.name].year++;
        }
      });
    });
  });
  // Giữ đúng thứ tự 4 lãnh đạo, luôn hiển thị dù = 0
  const leaderRows=LEADERS.map(l=>leaderMap[l.name]);
  const maxYear=Math.max(1,...leaderRows.map(x=>x.year));
  $('screen-dashboard').innerHTML=`
    <div class="stats-grid">

      ${statCardClickable('Ngày mai',countTomorrow,'Lịch sẽ diễn ra ngày mai','tomorrow')}
      ${statCardClickable('Trong tuần',countWeek,'Lịch họp tuần này','week')}

    </div>

      ${statCard('Tổng',d.total||0,'Tất cả lịch','stat-total')}
      <div class="dashboard-mobile-hide">${statCard('Đã duyệt',d.published||0,'Trạng thái PUBLISHED','stat-published')}</div>
      <div class="dashboard-mobile-hide">${statCard('Đã hủy',d.cancelled||0,'Trạng thái CANCELLED','stat-cancelled')}</div>
    </div>
    <div class="sp"></div>
    <div class="panel">
      <div class="panel-h"><h3>📊 Thống kê lãnh đạo</h3></div>
      <div class="panel-b">
        <div class="table-wrap">
          <table class="tbl leader-table dashboard-leader-table">
            <thead><tr><th>Lãnh đạo</th><th class="${APP.dashPeriod==='today'?'th-active':''}">NAY</th><th class="${APP.dashPeriod==='tomorrow'?'th-active':''}">MAI</th><th class="${APP.dashPeriod==='week'?'th-active':''}">TUẦN</th><th class="${APP.dashPeriod==='month'?'th-active':''}">THÁNG</th><th class="${APP.dashPeriod==='year'?'th-active':''}">NĂM</th></tr></thead>
            <tbody>
              ${leaderRows.map((x,i)=>{
                const _bg=x.bgClass||['leader-bg-moc','leader-bg-tho','leader-bg-thuy','leader-bg-kim'][i%4];
                return`<tr class="dashboard-leader-row ${_bg}">
                <td class="dashboard-leader-name"><span class="leader-full">Đ/c ${esc(x.name)}</span><span class="leader-short">${esc(x.short||('Đ/c '+x.name.split(' ').pop()))}</span></td>
                <td class="dashboard-leader-num" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','today')" title="Hôm nay">${x.today}</td>
                <td class="dashboard-leader-num" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','tomorrow')" title="Ngày mai">${x.tomorrow}</td>
                <td class="dashboard-leader-num" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','week')" title="Tuần này">${x.week}</td>
                <td class="dashboard-leader-num" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','month')" title="Tháng này">${x.month}</td>
                <td class="dashboard-leader-num" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','year')" title="Năm nay"><b>${x.year}</b></td>
              </tr>`}).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="sp"></div>
    <div class="two-col">
      <div class="panel"><div class="panel-h"><h3>Theo loại lịch</h3></div><div class="panel-b">${miniCountTable(d.byType||{},typeLabel,'type')}</div></div>

    </div>`;
}
function leaderMeetingBarChart(rows){
  rows=Array.isArray(rows)?rows:[];
  const totalYear=rows.reduce((sum,x)=>sum+(Number(x.year)||0),0);
  const totalMonth=rows.reduce((sum,x)=>sum+(Number(x.month)||0),0);
  const maxVal=Math.max(1,...rows.map(x=>Math.max(Number(x.year)||0, Number(x.month)||0)));
  const pct=(value,total)=> total>0 ? Math.round((Number(value)||0)*100/total) : 0;
  return `
    <div class="leader-bar-chart">
      <div class="leader-bar-legend">
        <span class="legend-item"><span class="legend-swatch" style="background:linear-gradient(180deg,#6fb0ff 0%, #0b67b2 100%)"></span>Trong năm</span>
        <span class="legend-item"><span class="legend-swatch" style="background:linear-gradient(180deg,#ffd98a 0%, #f2a007 100%)"></span>Trong tháng</span>
      </div>
      <div class="leader-bar-grid">
        ${rows.map(x=>{
          const year=Number(x.year)||0;
          const month=Number(x.month)||0;
          const yearPct=pct(year,totalYear);
          const monthPct=pct(month,totalMonth);
          const hYear=Math.max(year>0?18:8, Math.round((year/maxVal)*150)+10);
          const hMonth=Math.max(month>0?18:8, Math.round((month/maxVal)*150)+10);
          const shortName=esc(x.short || x.name.split(' ').pop());
          const fullName=esc('Đ/c '+x.name);
          return `
            <div class="leader-bar-item">
              <div class="leader-bar-bars">
                <div class="leader-bar-col year" style="height:${hYear}px" title="${fullName} - Trong năm: ${year} cuộc, chiếm ${yearPct}%" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','year')">
                  <span class="bar-value">${year}</span>
                  <span class="bar-percent">${yearPct}%</span>
                </div>
                <div class="leader-bar-col month" style="height:${hMonth}px" title="${fullName} - Trong tháng: ${month} cuộc, chiếm ${monthPct}%" onclick="openLeaderStatDetail('${esc(x.name)}','Đ/c ${esc(x.name)}','month')">
                  <span class="bar-value">${month}</span>
                  <span class="bar-percent">${monthPct}%</span>

                <div class="leader-bar-name">${shortName}</div>

              </div>
            </div>`;
        }).join('')}
      </div>
    </div>`;

function openStatDetail(period, label){
  APP.dashPeriod=period;
  renderDashboard();
  const today=new Date(); today.setHours(0,0,0,0);
  const tomorrowStart=new Date(today); tomorrowStart.setDate(today.getDate()+1); tomorrowStart.setHours(0,0,0,0);
  const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
  const[wStart,wEnd]=weekRange(today);
  const mStart=new Date(today.getFullYear(),today.getMonth(),1);
  const mEnd=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59,999);
  const yStart=new Date(today.getFullYear(),0,1);
  const yEnd=new Date(today.getFullYear(),11,31,23,59,59,999);
  const meetings=APP.allMeetings||APP.meetings||[];
  const nonTrucBan=meetings.filter(m=>m.loaiLich!=='TRUC_BAN');
  let arr=[];
  if(period==='today'){
    arr=meetings.filter(m=>isToday(m));
  } else if(period==='tomorrow'){
    const tomorrowStart=new Date(today); tomorrowStart.setDate(today.getDate()+1); tomorrowStart.setHours(0,0,0,0);
    const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
    arr=meetings.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=tomorrowEnd&&e>=tomorrowStart;});
  } else if(period==='week'){
    arr=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=wEnd&&e>=wStart;});
  } else if(period==='month'){
    arr=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=mEnd&&e>=mStart;});
  } else if(period==='year'){
    arr=nonTrucBan.filter(m=>{const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;return s&&e&&s<=yEnd&&e>=yStart;});
  }
  // Sort theo ngày

function openLeaderStatDetail(leaderName, leaderShort, period){
  const today=new Date(); today.setHours(0,0,0,0);
  const tomorrowStart=new Date(today); tomorrowStart.setDate(today.getDate()+1); tomorrowStart.setHours(0,0,0,0);
  const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
  const[wStart,wEnd]=weekRange(today);
  const mStart=new Date(today.getFullYear(),today.getMonth(),1);
  const mEnd=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59,999);
  const yStart=new Date(today.getFullYear(),0,1);
  const yEnd=new Date(today.getFullYear(),11,31,23,59,59,999);
  const meetings=APP.allMeetings||APP.meetings||[];
  function normLName(s){
    return String(s||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\u0111/g,'d')
      .replace(/^(d\/c|c)\s+/,'')
      .replace(/\s*[-\u2013]\s*.*/,'')
      .replace(/\s+/g,' ').trim();
  }
  const normTarget=normLName(leaderName);
  function matchLeader(m){
    const raw=meetingLeaderHaystack(m);
    const parts=String(raw||'').split(/[,;\n]+/).map(x=>x.trim()).filter(x=>x.length>1);
    return parts.some(p=>{
      const pn=normLName(p);
      return pn===normTarget||pn.includes(normTarget)||normTarget.includes(pn);
    });
  }
  let arr=meetings.filter(m=>{
    if(!matchLeader(m))return false;
    const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;
    if(!s)return false;
    if(period==='today')return s<=today&&e>=today;
    if(period==='tomorrow')return s<=tomorrowEnd&&e>=tomorrowStart;
    if(period==='week')return s<=wEnd&&e>=wStart;
    if(period==='month')return s<=mEnd&&e>=mStart;
    if(period==='year')return s<=yEnd&&e>=yStart;
    return true;
  });
  arr.sort((a,b)=>{const sa=parseIsoDate(a.ngayBatDau)||new Date(0),sb=parseIsoDate(b.ngayBatDau)||new Date(0);return sa-sb;});
  const periodLabel={today:'Hôm nay',tomorrow:'Ngày mai',week:'Tuần này',month:'Tháng này',year:'Năm nay'}[period]||period;
  const cards=arr.length?meetingCards(arr,true):'<div class="empty">Kh\xf4ng c\xf3 l\u1ecbch.</div>';
  showModal('<h3>\ud83d\udccb '+esc(leaderShort)+' \u2014 '+periodLabel+' \u2014 '+arr.length+' l\u1ecbch</h3>',
    '<div style="max-height:60vh;overflow:auto">'+cards+'</div>'+
    '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">\u0110\xf3ng</button></div>'
  );
}
