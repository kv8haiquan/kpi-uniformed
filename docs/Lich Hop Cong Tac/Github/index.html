function libraryIconFor(item){
  if(!item)return'📄';
  if(item.type==='folder'||item.mimeType==='application/vnd.google-apps.folder')return'<span class="folder-glyph" aria-hidden="true"></span>';
  const mt=String(item.mimeType||'').toLowerCase();
  const name=String(item.name||'').toLowerCase();
  if(mt.includes('pdf')||name.endsWith('.pdf'))return'📕';
  if(mt.includes('spreadsheet')||mt.includes('excel')||name.match(/\.(xls|xlsx|csv)$/))return'📊';
  if(mt.includes('document')||mt.includes('word')||name.match(/\.(doc|docx)$/))return'📝';
  if(mt.includes('presentation')||mt.includes('powerpoint')||name.match(/\.(ppt|pptx)$/))return'📽️';
  if(mt.includes('image')||name.match(/\.(png|jpg|jpeg|gif|webp)$/))return'🖼️';
  if(mt.includes('video'))return'🎞️';
  if(mt.includes('zip')||name.match(/\.(zip|rar|7z)$/))return'🗜️';
  return'📄';
}
function libraryGviewUrl(id){
  const rawId=String(id||'');
  const downloadUrl='https://drive.google.com/uc?export=download&id='+encodeURIComponent(rawId);
  return 'https://docs.google.com/gview?embedded=true&url='+encodeURIComponent(downloadUrl);
}
function libraryPdfDirectUrl(id){
  const rawId=String(id||'');
  // Dùng trình xem PDF của trình duyệt thay vì Google Drive preview để tránh nền đen.
  // Fragment #view=FitH giúp mặc định vừa chiều ngang, người dùng vẫn zoom được trong popup.
  return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(rawId) + '#toolbar=1&navpanes=0&scrollbar=1&view=FitH';
}
function normalizePreviewUrl_(src,item){
  const s=String(src||'');
  if(!s)return '';
  const id=String(item&&item.id||driveIdFromUrl(s)||'');
  /* Bản cũ từng tạo link gview không encode phần url=... nên Google Viewer báo No preview available. */
  if(id && s.includes('docs.google.com/gview') && s.includes('url=https://drive.google.com/uc?export=download&id=')){
    return libraryGviewUrl(id);
  }
  return s;
}
function libraryPreviewUrl(item){
  const rawId=String(item && item.id || '');
  const id=encodeURIComponent(rawId);
  const mt=String(item && item.mimeType || '').toLowerCase();
  const name=String(item && item.name || '').toLowerCase();
  const url=String(item && item.url || '');
  const pv=normalizePreviewUrl_(item && item.previewUrl, item);
  if(pv)return pv;

  // Google Docs/Sheets/Slides: dùng preview riêng, nền sáng, ít viền đen hơn Drive viewer.
  if(mt==='application/vnd.google-apps.document' || url.includes('docs.google.com/document/'))return `https://docs.google.com/document/d/${id}/preview?rm=minimal&embedded=true`;
  if(mt==='application/vnd.google-apps.spreadsheet' || url.includes('docs.google.com/spreadsheets/'))return `https://docs.google.com/spreadsheets/d/${id}/preview?rm=minimal&embedded=true`;
  if(mt==='application/vnd.google-apps.presentation' || url.includes('docs.google.com/presentation/'))return `https://docs.google.com/presentation/d/${id}/preview?rm=minimal&embedded=true`;
  if(mt==='application/vnd.google-apps.form')return item.url||`https://drive.google.com/open?id=${id}`;

  // PDF: ưu tiên mở trực tiếp bằng PDF viewer của trình duyệt để nền sáng và zoom vừa khung popup.
  if(mt==='application/pdf' || name.endsWith('.pdf')){
    return libraryPdfDirectUrl(rawId);
  }

  // Word/Excel/PowerPoint: dùng Google Viewer với URL đã encode đúng để tránh lỗi "No preview available".
  if(mt.includes('msword') || mt.includes('wordprocessingml') || mt.includes('spreadsheet') || mt.includes('excel') ||
     mt.includes('presentation') || mt.includes('powerpoint') || name.match(/\.(doc|docx|xls|xlsx|ppt|pptx)$/)){
    return libraryGviewUrl(rawId);
  }

  // Ảnh: mở trực tiếp trong iframe.
  if(mt.startsWith('image/') || name.match(/\.(png|jpg|jpeg|gif|webp)$/)){
    return `https://drive.google.com/uc?export=view&id=${id}`;
  }

  return `https://drive.google.com/file/d/${id}/preview?rm=minimal&embedded=true`;
}
function libraryOpenUrl(item){
  if(!item)return '#';
  if(item.openUrl)return item.openUrl;
  if(item.url)return item.url;
  return `https://drive.google.com/open?id=${encodeURIComponent(item.id||'')}`;
}

function driveIdFromUrl(url){
  const s=String(url||'');
  let m=s.match(/\/folders\/([a-zA-Z0-9_-]+)/); if(m)return m[1];
  m=s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/); if(m)return m[1];
  m=s.match(/\/(?:document|spreadsheets|presentation)\/d\/([a-zA-Z0-9_-]+)/); if(m)return m[1];
  m=s.match(/[?&]id=([a-zA-Z0-9_-]+)/); if(m)return m[1];
  return '';
}

async function apiDriveListFolder(folderId){

  const actions=['driveListFolder','getDriveFolderItems','getDriveFolder','listDriveFolder'];
  let lastErr=null;
  for(const act of actions){
    try{ return await api(act,{folderId:folderId}); }
    catch(e){
      lastErr=e;
      const msg=String((e&&e.message)||e||'');
      if(!msg.toLowerCase().includes('action không hợp lệ') && !msg.toLowerCase().includes('action khong hop le')) throw e;
    }
  }
  throw lastErr || new Error('Apps Script chưa có action driveListFolder.');
}

  const files=ev.dataTransfer ? ev.dataTransfer.files : null;
  if(!files || !files.length){
    librarySetUploadMsg(box,'Không nhận được file. Hãy kéo file từ máy tính vào vùng này, hoặc bấm vào vùng upload để chọn file. Nếu đang kéo file từ giao diện Google Drive/trình duyệt thì trình duyệt không chuyển file thật để upload.','err');
    return;
  }
  libraryUploadToFolder(folderId, files, box);
}
function librarySetUploadMsg(source,text,type){
  const wrap=source&&source.closest?source.closest('.library-uploadbox'):null;
  const el=wrap?wrap.querySelector('.library-upload-msg'):null;
  if(el){ el.textContent=text||''; el.className='library-upload-msg '+(type||''); }
  if(text) showLibraryHelp(text,type==='err'?'err':'');
}
async function libraryUploadToFolder(folderId,files,source){
  try{
    const valid=filterValidUploadFiles(files);
    if(!valid.length)return;
    if(!APP.token){ librarySetUploadMsg(source,'Phiên đăng nhập không còn hiệu lực, vui lòng đăng nhập lại rồi upload.','err'); return; }
    librarySetUploadMsg(source,`Đang upload ${valid.length} file vào Drive...`,'');
    const usingIframe=!canUseGoogleScriptRun();
    for(let i=0;i<valid.length;i++){
      const file=valid[i];
      librarySetUploadMsg(source,`Đang upload ${i+1}/${valid.length}: ${file.name}`,'');
      const base64=await readFile(file);
      const uploadId=makeUploadId();
      await api('uploadLibraryFile',{uploadId,folderId,rootFolderId:DRIVE_LIBRARY_FOLDER_ID,fileName:file.name,mimeType:file.type,base64});
      if(usingIframe){
        librarySetUploadMsg(source,`Đã gửi ${file.name}; đang kiểm tra kết quả trên Apps Script...`,'');
        await waitUploadStatus(uploadId,file.name);
      }
    }
    librarySetUploadMsg(source, 'Đã upload xong. Đang tải lại thư mục...','ok');
    if(source && source.value!==undefined) source.value='';
    if(usingIframe) await sleep(800);
    if(APP.popupDriveFolderId && String(APP.popupDriveFolderId)===String(folderId) && document.getElementById('driveFolderPopupBody')){
      await drivePopupFolderLoad(folderId,APP.popupDriveFolderTitle||'Thư mục tài liệu');
    }
    if(APP.libraryMode==='folder' && String(APP.libraryFolderId||'')===String(folderId||'')){
      fastCacheClearPrefix('libraryListFolder');
      await libraryLoadFolder(folderId,false,true);
    }
  }catch(e){
    const msg=(e&&e.message)||String(e||'Upload lỗi');
    librarySetUploadMsg(source,msg,'err');
    showLibraryHelp('Upload không thành công: '+msg+'. Hãy kiểm tra đã dán Code.gs V29, Deploy New version và tài khoản triển khai có quyền sửa thư mục Drive.', 'err');
  }
}
function libraryRenderItems(items, title, folderId){
  items=Array.isArray(items)?items:[];
  const folders=items.filter(x=>x.type==='folder'||x.mimeType==='application/vnd.google-apps.folder');
  const files=items.filter(x=>!(x.type==='folder'||x.mimeType==='application/vnd.google-apps.folder'));
  const sorted=[...folders,...files];
  return `<div class="library-browser">
    <div class="library-statusbar"><span>${title||'Danh sách thư viện'}: <b>${sorted.length}</b> mục</span><span class="muted">${folderId?'Kéo thả hoặc bấm vùng upload để chọn file':'Bấm thư mục/file để xem'}</span></div>
    ${folderId?libraryDropzoneHtml(folderId):''}
    ${sorted.length?`<div class="library-grid">${sorted.map(libraryItemCard).join('')}</div>`:'<div class="library-empty">Không tìm thấy file/thư mục phù hợp.</div>'}

async function libraryLoadFolder(folderId, push=true, force=false){
  libraryEnsureState();

  APP.libraryMode='folder';
  APP.libraryFolderId=folderId||DRIVE_LIBRARY_FOLDER_ID;
  APP.libraryError='';
  const cachePayload={folderId:APP.libraryFolderId, rootFolderId:DRIVE_LIBRARY_FOLDER_ID};
  const cached=!force ? fastCacheGet('libraryListFolder', cachePayload, 10*60*1000) : null;
  if(cached){
    APP.libraryLoading=false;
    APP.libraryMode='folder';
    APP.libraryData={folder:cached.folder||{},items:cached.items||[],path:cached.path||[]};
    APP.libraryFolderId=(cached.folder&&cached.folder.id)||APP.libraryFolderId;
    renderLibraryContent();
    updateLibraryButtons();
    showLibraryHelp('', '');
    return;
  }
  APP.libraryLoading=true;

function weekRange(d){
  const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const day=x.getDay()||7;const start=new Date(x);start.setDate(x.getDate()-day+1);start.setHours(0,0,0,0);
  const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
  return[start,end];
}
function parseIsoDate(v){if(!v)return null;const[y,m,d]=String(v).split('-').map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d)}

async function changeScope(scope){
  APP.filters.scope=scope;
  if(scope==='YEAR'||scope==='WEEK'||scope==='MONTH'){
    if(!APP.allMeetings&&!APP._loadingAll){
      APP._loadingAll=true;
      if($('calList'))$('calList').innerHTML='<div class="loading"><div class="spin"></div><span>Đang tải lịch...</span></div>';
      try{
        const res=await api('getMeetings',{showPast:true,limit:5000});
        APP.allMeetings=res.meetings||[];
        APP._loadingAll=false;
      }catch(e){APP._loadingAll=false;}
    }
    applyCalendarFilters(false);return;
  }
  if(scope==='ALL'&&!APP.loadedAll){
    $('calList').innerHTML='<div class="loading"><div class="spin"></div><span>Đang tải toàn bộ lịch...</span></div>';
    try{const res=await api('getMeetings',{showPast:true,limit:5000});APP.meetings=res.meetings||[];APP.loadedAll=true;
      const _td2=new Date();_td2.setHours(0,0,0,0);
      const _fm2=APP.meetings.filter(m=>{const e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau);return e&&e>=_td2;});
      $('navMeetCount').textContent=_fm2.length;
      const _bb=$('bnMeetBadge');if(_bb)_bb.textContent=_fm2.length;}
    catch(e){alert(e.message);}
  }
  applyCalendarFilters(false);
}

  if(read){
    const activeId=document.activeElement?document.activeElement.id:'';
    if(activeId==='calKwM')APP.filters.kw=($('calKwM')?.value||'').trim();
    else if(activeId==='calKw')APP.filters.kw=($('calKw')?.value||'').trim();
    else APP.filters.kw=(APP.filters.kw||'').trim();
    APP.filters.leader=$('calLeader')?.value||APP.filters.leader||'all';
    APP.filters.scope=$('calScope')?.value||APP.filters.scope;
  }
  const f=APP.filters;
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrowStart=new Date(today); tomorrowStart.setDate(today.getDate()+1); tomorrowStart.setHours(0,0,0,0);
  const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
  const[wStart,wEnd]=weekRange(today);
  const mStart=new Date(today.getFullYear(),today.getMonth(),1);
  const mEnd=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59,999);
  const yStart=new Date(today.getFullYear(),0,1);
  const yEnd=new Date(today.getFullYear(),11,31,23,59,59,999);
  // Dùng allMeetings cho tuần/tháng/năm/toàn bộ (cần lịch đã qua)
  const srcMeetings = (f.scope==='CURRENT') ? APP.meetings : (APP.allMeetings||APP.meetings);
  // Nếu chưa có allMeetings và cần lịch đã qua, load ngầm
  if(f.scope!=='CURRENT' && !APP.allMeetings && !APP._loadingAll){
    APP._loadingAll=true;
    api('getMeetings',{showPast:true,limit:5000}).then(res=>{
      APP.allMeetings=res.meetings||[];
      APP._loadingAll=false;
      applyCalendarFilters(false);
    }).catch(()=>{APP._loadingAll=false;});
    if($('calCount'))$('calCount').textContent='Đang tải...';
  }
  let arr=srcMeetings.filter(m=>{
    const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;
    // Lịch thiếu/lỗi ngày không được coi là "hiện thời" mãi mãi — loại khỏi danh sách thay vì hiện mặc định.
    if(f.scope==='CURRENT'&&(!s||!e||e<today))return false;
    if(f.scope==='WEEK'&&(!s||!e||e<wStart||s>wEnd))return false;
    if(f.scope==='MONTH'&&(!s||!e||s>mEnd||e<mStart))return false;
    if(f.scope==='YEAR'&&(!s||!e||s>yEnd||e<yStart))return false;
    const isGB=isGiaoBanMeeting(m);
    if(f.kind==='TRUC_BAN'&&!isGB)return false;
    if(f.kind==='HOP'&&isGB)return false;
    // f.kind==='ALL': hiển thị tất cả
    if(f.leader!=='all'&&!matchLeaderExact(m,f.leader))return false;
    if(f.kw){const hay=`${m.meetingId||''} ${m.noiDung||''} ${m.thanhPhan||''} ${m.diaDiem||''} ${m.chuTri||''} ${m.ghiChu||''} ${m.soVanBan||''}`;if(!smartMatch(hay,f.kw))return false;}
    return true;
  });
  if($('calCount'))$('calCount').textContent=`${arr.length} lịch · ${scopeLabel(f.scope)}`;
  if($('calList')){
    if(!arr.length&&f.scope==='CURRENT'){
      $('calList').innerHTML='<div class="empty">Chưa có lịch cập nhật cho ngày hôm nay và các ngày tiếp theo.</div>';
    }else{
      $('calList').innerHTML=meetingCards(arr);
    }
  }
}
function scopeLabel(v){return({CURRENT:'Từ hôm nay',ALL:'Toàn bộ',WEEK:'Tuần này',MONTH:'Tháng này',YEAR:'Năm nay'}[v]||v)}
function dateVNShort(iso){if(!iso)return'';var s=String(iso).trim();var m1=s.match(/^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})/);if(m1)return Number(m1[3])+'/'+(+m1[2])+'/'+m1[1];var m2=s.match(/^([0-9]{1,2})\/([0-9]{1,2})\/([0-9]{4})/);if(m2)return Number(m2[1])+'/'+(+m2[2])+'/'+m2[3];try{var dt=new Date(s);if(!isNaN(dt.getTime()))return dt.getDate()+'/'+(dt.getMonth()+1)+'/'+dt.getFullYear();}catch(e){}return s;}
function weekdayLabel(m){if(m.thu)return m.thu;const dt=parseIsoDate(m.ngayBatDau);if(!dt)return'';return['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][dt.getDay()]}
function timeRange(m){return`${esc(m.gioBatDau||'')}${m.gioKetThuc?'–'+esc(m.gioKetThuc):''}`}
function isGiaoBanMeeting(m){return m.loaiLich==='TRUC_BAN';}
function isToday(m){
  const today=new Date();const s=parseIsoDate(m.ngayBatDau);const e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;
  if(!s)return false;
  today.setHours(0,0,0,0);
  return s<=today&&e>=today;
}

function meetingFolderRef(m){return (m&&(m.fileFolderId||m.folderId||m.linkFolder))||'';}
function meetingAttachHtml(m){
  const count=Number((m&&m.fileCount)||0);
  const folderRef=meetingFolderRef(m);
  if(count>0){
    if(count===1 && m.firstFileUrl){
      return `<div class="m-meta-row"><span class="label">📎 Tài liệu</span><button type="button" class="btn xs primary" onclick='openDriveFilePopup(${jss(m.firstFileUrl)},${jss('Tài liệu '+m.meetingId)},${jss('')})'>1 file</button></div>`;
    }
    if(folderRef){
      return `<div class="m-meta-row"><span class="label">📎 Tài liệu</span><button type="button" class="btn xs primary" onclick='openDriveFolderPopup(${jss(folderRef)},${jss(m.fileFolderName||('Thư mục tài liệu '+m.meetingId))})'>${count} file</button></div>`;
    }
    return `<div class="m-meta-row"><span class="label">📎 Tài liệu</span><span style="font-weight:700">${count} file</span><span class="muted" style="font-size:.76rem;margin-left:4px">(chưa có link Drive)</span></div>`;
  }
  // V45: sau đồng bộ tài liệu cũ, có thể server chưa trả fileCount kịp nhưng lịch vẫn có FOLDER_ID/LINK_FOLDER.
  // Khi đó vẫn hiện nút mở thư mục để người dùng không bị mất truy cập tài liệu.
  if(folderRef){
    return `<div class="m-meta-row"><span class="label">📎 Tài liệu</span><button type="button" class="btn xs ghost" onclick='openDriveFolderPopup(${jss(folderRef)},${jss(m.fileFolderName||('Thư mục tài liệu '+m.meetingId))})'>Mở tài liệu</button></div>`;
  }
  return `<div class="m-meta-row"><span class="label">📎 Tài liệu</span><span class="muted">0 file</span></div>`;
}
function manageFileBadgeHtml(m){
  const count=Number((m&&m.fileCount)||0);
  const folderRef=meetingFolderRef(m);
  if(count>0) return `<br><span class="manage-file-badge">📎 ${esc(count)} file</span>`;
  if(folderRef) return `<br><span class="manage-file-badge">📎 Có thư mục tài liệu</span>`;
  return '';
}
function meetingCards(arr,compact){
  if(!arr||!arr.length)return'<div class="empty">Không có lịch phù hợp.</div>';
  return'<div class="cards">'+arr.map(m=>{
    const thu=weekdayLabel(m);
    const isWE=(thu==='Thứ Bảy'||thu==='Chủ Nhật');
    const isTd=isToday(m);
    const isRange=m.ngayBatDau&&m.ngayKetThuc&&m.ngayBatDau!==m.ngayKetThuc;
    const dateText=isRange?(dateVNShort(m.ngayBatDau)+' – '+dateVNShort(m.ngayKetThuc)):dateVNShort(m.ngayHienThi||m.ngayBatDau);
    return`<div class="meeting-card${isGiaoBanMeeting(m)?' truc':''}">
      <div class="m-top">
        <div class="m-badges">
          <span class="pill mono">${esc(m.meetingId)}</span>
          <span class="pill type-${esc(m.loaiLich)}">${esc(typeLabel(m.loaiLich))}</span>
        </div>
        <div class="m-dateline">
          <span class="date-pill${isWE?' weekend':''}${isTd?' today':''}">${esc(dateText)}</span>
          <span class="date-pill${isWE?' weekend':''}">${esc(thu)}</span>
          <span class="date-pill time">⏰ ${timeRange(m)}</span>
        </div>
      </div>
      <div class="m-title">${esc(m.noiDung)}</div>
      <div class="m-meta">
        ${m.diaDiem?`<div class="m-meta-row"><span class="label">📍 Địa điểm</span><span>${esc(m.diaDiem)}</span></div>`:''}
        ${m.chuTri?`<div class="m-meta-row"><span class="label">👤 Chủ trì</span><span>${esc(m.chuTri)}</span></div>`:''}
        ${m.thanhPhan&&!compact?`<div class="m-meta-row"><span class="label">👥 Thành phần</span><span>${esc(m.thanhPhan)}</span></div>`:''}
        ${m.ghiChu&&!compact?`<div class="m-meta-row"><span class="label">📝 Ghi chú</span><span>${esc(m.ghiChu)}</span></div>`:''}
        ${meetingAttachHtml(m)}
      </div>
      <div class="m-actions">
        <button type="button" class="btn sm js-open-detail" data-action="open-detail" data-meeting-id="${esc(m.meetingId)}">👁 Xem chi tiết</button>
        ${canUseMeetingNote(m)?`<button type="button" class="btn sm note-btn" data-action="open-note" data-meeting-id="${esc(m.meetingId)}" data-meeting-title="${esc(m.noiDung)}">📒 Note</button>`:''}
        ${prepRatingStarsHtml(m,'card')}
        ${hasRole(ROLE_EDIT)?`<button type="button" class="btn primary sm js-edit-meeting" data-action="edit-meeting" data-meeting-id="${esc(m.meetingId)}">✏️ Sửa</button>`:''}
      </div>
    </div>`;
  }).join('')+'</div>';
}

function readManageFilters(){
  APP.manageFilters=APP.manageFilters||{kw:'',leader:'all',scope:'CURRENT',kind:'ALL',status:'all'};
  const f=APP.manageFilters;
  f.kw=($('mgKw')?.value||f.kw||'').trim();
  f.leader=$('mgLeader')?.value||f.leader||'all';
  f.scope=$('mgScope')?.value||f.scope||'CURRENT';
  f.status=$('mgStatus')?.value||f.status||'all';
  f.kind=f.kind||'ALL';
  return f;
}
function applyManageFilters(read=true){
  if(read)readManageFilters();
  else{
    APP.manageFilters=APP.manageFilters||{kw:'',leader:'all',scope:'CURRENT',kind:'ALL',status:'all'};
    if($('mgKw'))APP.manageFilters.kw=$('mgKw').value.trim();
  }
  renderManageTable();
}
async function changeManageScope(scope){
  APP.manageFilters=APP.manageFilters||{kw:'',leader:'all',scope:'CURRENT',kind:'ALL',status:'all'};
  APP.manageFilters.scope=scope;
  if(scope!=='CURRENT'&&!APP.allMeetings&&!APP._loadingAll){
    APP._loadingAll=true;
    if($('mgTable'))$('mgTable').innerHTML='<div class="loading"><div class="spin"></div><span>Đang tải dữ liệu lịch...</span></div>';
    try{const res=await api('getMeetings',{showPast:true,limit:5000});APP.allMeetings=res.meetings||[];}
    catch(e){alert(e.message||'Không tải được dữ liệu lịch.');}
    finally{APP._loadingAll=false;}
  }
  renderManageTable();
}
function setManageKind(kind){
  APP.manageFilters=APP.manageFilters||{kw:'',leader:'all',scope:'CURRENT',kind:'ALL',status:'all'};
  APP.manageFilters.kind=kind;
  if($('screen-manage')&&!$('screen-manage').classList.contains('hide'))renderManage();
}
function manageFilteredMeetings(){
  const f=readManageFilters();
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrowStart=new Date(today); tomorrowStart.setDate(today.getDate()+1); tomorrowStart.setHours(0,0,0,0);
  const tomorrowEnd=new Date(tomorrowStart); tomorrowEnd.setHours(23,59,59,999);
  const[wStart,wEnd]=weekRange(today);
  const mStart=new Date(today.getFullYear(),today.getMonth(),1);
  const mEnd=new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59,999);
  const yStart=new Date(today.getFullYear(),0,1);
  const yEnd=new Date(today.getFullYear(),11,31,23,59,59,999);
  const src=(f.scope==='CURRENT')?APP.meetings:(APP.allMeetings||APP.meetings);
  if(f.scope!=='CURRENT'&&!APP.allMeetings&&!APP._loadingAll){
    APP._loadingAll=true;
    api('getMeetings',{showPast:true,limit:5000}).then(res=>{APP.allMeetings=res.meetings||[];APP._loadingAll=false;renderManageTable();}).catch(()=>{APP._loadingAll=false;});
  }
  return src.filter(m=>{
    const s=parseIsoDate(m.ngayBatDau),e=parseIsoDate(m.ngayKetThuc||m.ngayBatDau)||s;
    if(f.scope==='CURRENT'&&e&&e<today)return false;
    if(f.scope==='WEEK'&&(!s||!e||e<wStart||s>wEnd))return false;
    if(f.scope==='MONTH'&&(!s||!e||s>mEnd||e<mStart))return false;
    if(f.scope==='YEAR'&&(!s||!e||s>yEnd||e<yStart))return false;
    const isGB=isGiaoBanMeeting(m);
    if(f.kind==='TRUC_BAN'&&!isGB)return false;
    if(f.kind==='HOP'&&isGB)return false;
    if(f.leader!=='all'&&!matchLeaderExact(m,f.leader))return false;
    if(f.status!=='all'&&m.trangThai!==f.status)return false;
    if(f.kw){
      const hay=`${m.meetingId||''} ${m.noiDung||''} ${m.diaDiem||''} ${m.chuTri||''} ${m.lanhDaoLienQuan||''} ${m.thanhPhan||''} ${m.soVanBan||''} ${m.ghiChu||''}`;
      if(!smartMatch(hay,f.kw))return false;
    }
    return true;
  }).sort((a,b)=>dateKeyClient(a.ngayBatDau)-dateKeyClient(b.ngayBatDau)||(a.gioBatDau||'').localeCompare(b.gioBatDau||'')||(a.meetingId||'').localeCompare(b.meetingId||''));
}
function dateKeyClient(v){const d=parseIsoDate(v);return d?d.getTime():0;}

  </table></div>`;

function exportManageExcel(){
  const arr=manageFilteredMeetings();
  if(!arr.length){ alert('Không có lịch phù hợp để xuất Excel.'); return; }
  const f=APP.manageFilters||{};
  const filterText=[
    'Từ khóa: '+(f.kw||'Tất cả'),
    'Lãnh đạo: '+(f.leader==='all'?'Tất cả':leaderFullName(f.leader||'')),
    'Phạm vi: '+scopeLabel(f.scope||'CURRENT'),
    'Loại lịch: '+(f.kind==='TRUC_BAN'?'Trực ban':(f.kind==='HOP'?'Lịch họp':'Tất cả')),
    'Trạng thái: '+(f.status==='all'?'Tất cả':statusLabel(f.status||''))
  ].join(' | ');
  const cols=['STT','Mã lịch','Ngày hiển thị','Ngày bắt đầu','Ngày kết thúc','Thứ','Giờ bắt đầu','Giờ kết thúc','Loại lịch','Nội dung','Thành phần','Địa điểm','Chủ trì','Lãnh đạo liên quan','Đơn vị chuẩn bị','Số văn bản','Ghi chú','Trạng thái','Số file','Thư mục tài liệu'];
  const rows=arr.map((m,i)=>[
    i+1,
    m.meetingId||'',
    m.ngayHienThi||'',
    m.ngayBatDau||'',
    m.ngayKetThuc||'',
    m.thu||'',
    m.gioBatDau||'',
    m.gioKetThuc||'',
    typeLabel(m.loaiLich||''),
    m.noiDung||'',
    m.thanhPhan||'',
    m.diaDiem||'',
    m.chuTri||'',
    m.lanhDaoLienQuan||'',
    m.donViChuanBi||'',
    m.soVanBan||'',
    m.ghiChu||'',
    statusLabel(m.trangThai||''),
    m.fileCount||0,
    m.linkFolder||m.folderId||m.fileFolderId||''
  ]);
  const safe=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const cell=v=>'<td style="vertical-align:top;border:1px solid #d9e3ec;padding:5px 7px">'+safe(v)+'</td>';
  const th=v=>'<th style="background:#0f4c81;color:#fff;border:1px solid #0f4c81;padding:6px 7px;text-align:center">'+safe(v)+'</th>';
  const html='<!doctype html><html><head><meta charset="UTF-8"></head><body>'+
    '<h2 style="font-family:Arial;color:#063a63">QUẢN LÝ LỊCH CÔNG TÁC HQKV8</h2>'+
    '<p style="font-family:Arial">'+safe(filterText)+'</p>'+
    '<table style="border-collapse:collapse;font-family:Arial;font-size:10pt"><thead><tr>'+cols.map(th).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('')+'</tbody></table>'+
    '</body></html>';
  const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');

function pad2_(n){return String(Number(n)||0).padStart(2,'0')}
function formatMeetingDateDisplay(v){
  if(!v) return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return pad2_(m[3])+'/'+pad2_(m[2])+'/'+m[1];
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return pad2_(m[1])+'/'+pad2_(m[2])+'/'+m[3];
  const d=new Date(s);
  if(!isNaN(d.getTime())) return pad2_(d.getDate())+'/'+pad2_(d.getMonth()+1)+'/'+d.getFullYear();
  return s;
}
function normalizeMeetingDateInput(v){
  return formatMeetingDateDisplay(v).replace(/-/g,'/');
}
function parseMeetingDateToIso(v){
  const s=String(v||'').trim();
  if(!s) return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    const y=Number(m[1]), mo=Number(m[2]), d=Number(m[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d) return y+'-'+pad2_(mo)+'-'+pad2_(d);
    return '';
  }
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    const d=Number(m[1]), mo=Number(m[2]), y=Number(m[3]);
    const dt=new Date(y,mo-1,d);
    if(dt.getFullYear()===y && dt.getMonth()===mo-1 && dt.getDate()===d) return y+'-'+pad2_(mo)+'-'+pad2_(d);
    return '';
  }
  return '';
}

async function saveMeeting(id){
  let gioBatDau, gioKetThuc;
  try{
    gioBatDau=requireHHmm('fTimeStart','Giờ bắt đầu');
    gioKetThuc=requireHHmm('fTimeEnd','Giờ kết thúc');
  }catch(e){ alert(e.message); return; }
  const ngayBatDau=parseMeetingDateToIso($('fStart').value);
  const ngayKetThuc=parseMeetingDateToIso($('fEnd').value||$('fStart').value);
  if(!ngayBatDau){ alert('Ngày bắt đầu chưa đúng định dạng dd/mm/yyyy.'); return; }
  if($('fEnd').value && !ngayKetThuc){ alert('Ngày kết thúc chưa đúng định dạng dd/mm/yyyy.'); return; }
  if(parseIsoDate(ngayKetThuc) && parseIsoDate(ngayBatDau) && parseIsoDate(ngayKetThuc) < parseIsoDate(ngayBatDau)){ alert('Ngày kết thúc không được trước ngày bắt đầu.'); return; }
  const form={meetingId:id,ngayBatDau,ngayKetThuc,gioBatDau,gioKetThuc,loaiLich:$('fType').value,trangThai:$('fStatus').value,noiDung:$('fContent').value,diaDiem:$('fPlace').value,chuTri:$('fChair').value,lanhDaoLienQuan:$('fLeader').value,thanhPhan:$('fPart').value,donViChuanBi:$('fUnit').value,deptLeadUser:$('fDeptLead').value,soVanBan:$('fDoc').value,ghiChu:$('fNote').value};
  const btn=$('btnSaveMeeting');if(btn){btn.disabled=true;btn.textContent='Đang lưu...'}
  try{
    const res=await api(id?'updateMeeting':'createMeeting',{meetingId:id,form});
    const meetingId=res.meetingId||id;
    if(APP.pendingFormFiles.length){
      msg($('saveMsg'),`Đang upload ${APP.pendingFormFiles.length} file...`);
      for(const file of APP.pendingFormFiles){validateUploadFile(file);const base64=await readFile(file);await api('uploadMeetingFile',{meetingId,fileType:$('fUploadType').value,fileVisibility:($('fUploadVisibility')?.value||'PUBLIC'),fileName:file.name,mimeType:file.type,base64});}
    }
    closeModal();await refreshAll();
  }catch(e){alert(e.message);if(btn){btn.disabled=false;btn.textContent='💾 Lưu lịch'}}
}

const NOTE_ALLOWED_EXT = new Set(['pdf','doc','docx','xls','xlsx','jpg','jpeg','png','gif','webp']);
function notePlainText(s, max=220){
  const t=String(s||'').replace(/\s+/g,' ').trim();
  return t.length>max ? t.slice(0,max-1)+'…' : t;
}
function noteDateOnlyLabel(v){
  const s=String(v||'').trim();
  if(!s)return '';
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return `${String(m[1]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${m[3]}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${String(m[3]).padStart(2,'0')}/${String(m[2]).padStart(2,'0')}/${m[1]}`;
  const d=new Date(s);
  if(!isNaN(d.getTime())){
    try{
      return new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric'}).format(d);
    }catch(e){
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }
  }
  return s.replace(/\s+\d{1,2}:\d{2}(:\d{2})?.*$/,'');
}
function noteTimeLabel(n){return esc(noteDateOnlyLabel(n.updatedAt||n.createdAt||''));}
function noteFileIcon(name,mime){
  const n=String(name||'').toLowerCase(); const m=String(mime||'').toLowerCase();
  if(m.startsWith('image/')||n.match(/\.(png|jpg|jpeg|gif|webp)$/))return '🖼️';
  if(m.includes('pdf')||n.endsWith('.pdf'))return '📕';
  if(n.match(/\.(xls|xlsx)$/)||m.includes('spreadsheet')||m.includes('excel'))return '📊';
  if(n.match(/\.(doc|docx)$/)||m.includes('word'))return '📝';
  return '📎';
}

async function renderNotebook(){
  const box=$('screen-notebook'); if(!box)return;
  const kw=APP.notebook.kw||'';
  renderNotebookShell(kw);
  const cachePayload={keyword:kw};
  if(!APP.notebook.forceRefresh){
    if(APP.notebook.loaded && APP.notebook.lastKw===kw){
      renderNotebookList(APP.notebook.notes||[]);
      return;
    }
    const cached=fastCacheGet('getNotes', cachePayload, 5*60*1000);
    if(cached){
      APP.notebook.notes=cached.notes||[];
      APP.notebook.loaded=true;
      APP.notebook.lastKw=kw;
      updateNotebookUnreadBadge(cached.unreadSharedCount || 0);
      renderNotebookList(APP.notebook.notes);
      return;
    }
  }
  APP.notebook.forceRefresh=false;
  const list=$('notebookList');
  if(list) list.innerHTML='<div class="loading"><div class="spin"></div><span>Đang tải ghi chú...</span></div>';
  try{
    const res=await api('getNotes',cachePayload);
    APP.notebook.notes=res.notes||[]; APP.notebook.loaded=true; APP.notebook.lastKw=kw;
    fastCacheSet('getNotes', cachePayload, {notes:APP.notebook.notes, unreadSharedCount:res.unreadSharedCount||0});
    updateNotebookUnreadBadge(res.unreadSharedCount || 0);
    renderNotebookList(APP.notebook.notes);
  }catch(e){
    const list=$('notebookList'); if(list) list.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;
  }
}

function validateNoteAttachmentFile(file){
  if(!file)throw new Error('Không có file đính kèm.');
  const ext=getFileExt(file.name);
  if(!NOTE_ALLOWED_EXT.has(ext))throw new Error('Notebook chỉ nhận ảnh, PDF, Word, Excel. File không hợp lệ: '+file.name);
  if(file.size>MAX_UPLOAD_SIZE)throw new Error('File "'+file.name+'" vượt quá giới hạn 50MB.');
}
function renderNoteQueue(){
  const box=$('noteQueuedFiles'); if(!box)return;

  box.innerHTML=q.length?`<div class="note-attach-list">${q.map((f,i)=>`<div class="note-attach-item"><div>${noteFileIcon(f.name,f.type)} <b>${esc(f.name)}</b><br><span class="muted">${Math.round((f.size||0)/1024)} KB</span></div><button type="button" class="btn xs danger" onclick="removeNoteQueuedFile(${i})">Bỏ</button></div>`).join('')}</div>`:'';

function removeNoteQueuedFile(i){APP.noteUploadQueue.splice(i,1);renderNoteQueue();}
function addNoteQueuedFiles(files){
  const arr=Array.from(files||[]);
  arr.forEach(validateNoteAttachmentFile);
  APP.noteUploadQueue.push(...arr);
  renderNoteQueue();
}
function setupNoteAttachZone(){
  const zone=$('noteAttachZone'), input=$('noteAttachInput'); if(!zone||!input)return;
  input.onchange=()=>{try{addNoteQueuedFiles(input.files);input.value='';}catch(e){msg($('noteSaveMsg'),e.message,'err');}};

function noteRecipientInitials(u){
  const name=String((u&&u.fullname)||'').trim() || String((u&&u.username)||'').trim();
  const parts=name.split(/\s+/).filter(Boolean);
  if(!parts.length)return 'U';
  if(parts.length===1)return parts[0].slice(0,2).toUpperCase();
  return (parts[parts.length-2][0]+parts[parts.length-1][0]).toUpperCase();
}

function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');
    r.onerror=()=>reject(new Error('Không đọc được file: '+file.name));
    r.readAsDataURL(file);
  });
}
async function uploadNoteQueuedFiles(noteId){
  const q=APP.noteUploadQueue||[];
  if(!q.length)return {ok:true,count:0};
  for(let i=0;i<q.length;i++){
    const f=q[i];
    msg($('noteSaveMsg'),`Đang upload file ${i+1}/${q.length}: ${f.name}`,'');
    const uploadId=makeUploadId();
    const base64=await readFileAsBase64(f);
    let res=await api('uploadNoteFile',{uploadId,noteId,fileName:f.name,mimeType:f.type||'',data:base64});
    if(uploadId && (!res || !res.noteFileId)) res=await waitUploadStatus(uploadId,f.name);
  }
  APP.noteUploadQueue=[];
  return {ok:true,count:q.length};
}
async function saveNoteFromEditor(meetingId, noteId){
  const btn=$('btnSaveNote'); if(btn){btn.disabled=true;btn.textContent='Đang lưu...';}
  try{
    const uploadId=makeUploadId();
    const form={noteId,meetingId,title:($('noteTitle')?.value||'').trim(),content:($('noteContent')?.value||'').trim()};
    let res=await api('saveNote',{uploadId,noteId,meetingId,form});
    if(uploadId && (!res || !res.noteId)) res=await waitUploadStatus(uploadId,'ghi chú');
    const savedNoteId=res.noteId||noteId;
    await uploadNoteQueuedFiles(savedNoteId);
    msg($('noteSaveMsg'),(res.msg||'Đã lưu ghi chú.') + ((APP.noteUploadQueue||[]).length?'':'') ,'ok');
    APP.notebook.loaded=false;fastCacheClearPrefix('getNotes');
    setTimeout(async()=>{
      closeModal();
      if(meetingId && APP.currentScreen!=='notebook') openDetail(meetingId);
      else await renderNotebook();
    },650);
  }catch(e){
    msg($('noteSaveMsg'),e.message||String(e),'err');
    if(btn){btn.disabled=false;btn.textContent='💾 Lưu ghi chú';}
  }
}

function isDriveFolderLink(url){
  const s=String(url||'');
  return /\/folders\/[a-zA-Z0-9_-]+/.test(s) || /[?&]folderId=/.test(s);
}
function isMeetingFolderFile(f){
  if(!f)return false;
  return String(f.linkType||'').toLowerCase()==='folder' ||
         String(f.mimeType||'').toLowerCase()==='application/vnd.google-apps.folder' ||
         isDriveFolderLink(f.fileUrl) ||
         (f.folderId && !f.driveFileId && !String(f.fileUrl||'').includes('/file/d/'));
}
function legacySyncBox(id,res){
  const info=(res&&res.legacyInfo)||{};
  if(!info.hasLegacyFolder)return'';
  const n=Number(info.fileCount||0);
  return `<div class="msg" style="margin:0 0 10px;border-left-color:var(--gold)">
    <b>Phát hiện tài liệu theo lịch cũ:</b> ${n} file trong ${Number(info.folderCount||0)} thư mục cũ.
    <button type="button" class="btn xs primary" style="margin-left:8px" onclick="syncLegacyFiles('${esc(id)}')">Đồng bộ về thư mục ${esc(id)}</button>
    <span class="muted" style="font-size:.78rem;margin-left:6px">Sau đồng bộ, hệ thống sẽ hiển thị từng file và mở trực tiếp trong web app.</span>
  </div>`;
}
async function syncLegacyFiles(id){
  if(!confirm('Đồng bộ toàn bộ tài liệu theo lịch cũ về thư mục mới của '+id+'?\n\nHệ thống sẽ sao chép file sang thư mục LHxxxx và ẩn dòng link thư mục cũ để tránh đếm trùng.'))return;
  try{
    const res=await api('migrateMeetingLegacyFiles',{meetingId:id,mode:'copy',hideLegacy:true});
    alert((res&&res.msg?res.msg:'Đã đồng bộ')+'\nSao chép: '+(res.copied||0)+' file; bỏ qua: '+(res.skipped||0)+' file.');
    await refreshAll();
    setTimeout(()=>openDetail(id),300);
  }catch(e){alert((e&&e.message)||String(e||'Không đồng bộ được tài liệu cũ.'))}
}
async function syncLegacyFilesFromManage(id){
  if(!canBulkLegacySync()) { alert('Chỉ tài khoản Admin/SuperAdmin được đồng bộ tài liệu cũ.'); return; }
  if(!id) { alert('Thiếu mã lịch cần đồng bộ.'); return; }
  if(!confirm('Đồng bộ tài liệu cũ riêng cho lịch '+id+'?\n\nHệ thống sẽ chờ tối đa khoảng 5 phút 30 giây cho lịch này. Nên để nguyên cửa sổ cho đến khi có thông báo kết quả.')) return;
  const btn=$('btnSyncLegacy_'+id);
  const oldText=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Đang đồng bộ...'; }
  const started=Date.now();
  try{
    const res=await api('migrateMeetingLegacyFiles',{meetingId:id,mode:'copy',hideLegacy:true});
    const copied=Number(res&&res.copied||0), moved=Number(res&&res.moved||0), skipped=Number(res&&res.skipped||0);
    const elapsed=Math.round((Date.now()-started)/1000);
    alert((res&&res.msg?res.msg:'Đã đồng bộ tài liệu cũ.')+'\nLịch: '+id+'\nSao chép: '+copied+'; di chuyển: '+moved+'; bỏ qua: '+skipped+'; thời gian: '+elapsed+' giây.');
    await refreshAll();
    renderManageTable();
  }catch(e){
    alert('Không đồng bộ được tài liệu cũ cho '+id+'.\n'+((e&&e.message)||String(e||'')));
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=oldText||'Đồng bộ TL'; }
  }
}
function fileList(files){
  if(!files||!files.length)return'<div class="empty">Chưa có tài liệu.</div>';
  return files.map((f,i)=>{
    const isFolder=isMeetingFolderFile(f);
    const btnLabel=isFolder?'📁 Mở':'👁 Xem';
    const metaFolder=isFolder?'Thư mục Drive':(f.isVirtualFromFolder?'Tệp trong thư mục cũ':'Tệp Drive');
    const src=f.sourceFolderName?` · ${esc(f.sourceFolderName)}`:'';
    return `<div class="file-row"><div><b>${esc(f.fileName)}</b><br><span class="muted" style="font-size:.78rem">${esc(f.fileType)} · ${esc(fileVisibilityLabel(f.fileVisibility))} · V${esc(f.version)} · ${esc(f.uploadedBy)} · ${esc(dateVNShort(f.uploadedAt))} · ${esc(metaFolder)}${src}</span></div><button type="button" class="btn sm primary" onclick="openMeetingDetailFile(${i})">${btnLabel}</button></div>`;
  }).join('')
}
function openMeetingDetailFile(index){
  const f=(APP.detailFiles||[])[Number(index)];
  if(!f){ alert('Không tìm thấy thông tin tài liệu trong chi tiết lịch.'); return; }

  // Các tài liệu import cũ thường lưu bằng link thư mục Drive trong FILE_URL,
  // không phải link file /file/d/..., nên phải mở bằng trình duyệt thư mục của web app.
  if(isMeetingFolderFile(f)){
    const folderRef=f.folderId || f.fileUrl || f.driveFileId;
    if(!folderRef){ alert('Tài liệu import cũ chưa có link thư mục Drive.'); return; }
    openDriveFolderPopup(folderRef, f.fileName || ('Tài liệu '+(f.meetingId||'')));
    return;
  }

  let url=f.fileUrl || '';
  if(!url && f.driveFileId) url='https://drive.google.com/file/d/'+encodeURIComponent(f.driveFileId)+'/view?usp=sharing';
  if(!url){ alert('Không có đường dẫn file Drive để xem.'); return; }
  openDriveFilePopup(url, f.fileName, f.mimeType);
}
function uploadBox(id){return`<div style="margin-top:12px"><div class="field"><label>Loại tài liệu</label><select id="upType">${fileTypeOptions('TAI_LIEU_HOP')}</select></div><div class="field"><label>Phạm vi xem tài liệu</label><select id="upVisibility">${fileVisibilityOptions('PUBLIC')}</select><div class="hint">Mặc định công khai. Người upload luôn xem được file do mình upload.</div></div><div id="drop" class="drop">Kéo thả file vào đây hoặc bấm để chọn file<br><span class="muted" style="font-size:.76rem">PDF, Word, Excel, PowerPoint, ảnh, zip...</span><input id="fileInput" type="file" multiple class="hide"></div><div id="upMsg"></div></div>`}
function setupDrop(id){
  const d=$('drop');if(!d)return;const inp=$('fileInput');
  d.onclick=()=>inp.click();
  d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};
  d.ondragleave=()=>d.classList.remove('drag');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');uploadFiles(id,e.dataTransfer.files)};
  inp.onchange=()=>uploadFiles(id,inp.files);
}
async function uploadFiles(id,files){
  if(!files||!files.length)return;const el=$('upMsg');msg(el,`Đang upload ${files.length} file...`);
  for(const file of files){const base64=await readFile(file);await api('uploadMeetingFile',{meetingId:id,fileType:$('upType').value,fileVisibility:($('upVisibility')?.value||'PUBLIC'),fileName:file.name,mimeType:file.type,base64});}
  msg(el,'Đã upload xong. Đang tải lại...','ok');await refreshAll();setTimeout(()=>openDetail(id),500);
}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
function logList(logs){
  if(!logs||!logs.length)return'<div class="empty">Chưa có nhật ký.</div>';
  return logs.map(l=>`<div class="log-item"><b>${esc(l.action)}</b> · <span class="muted">${esc(l.byUser)}</span> · <span class="muted">${esc(l.atTime)}</span><br>${l.fieldName?`<span class="muted">${esc(l.fieldName)}${l.oldValue||l.newValue?': '+esc(l.oldValue)+' → '+esc(l.newValue):''}</span>`:''} ${l.note?'<span class="muted">· '+esc(l.note)+'</span>':''}</div>`).join('')
}

async function saveChangePassword(){
  const oldPw=document.getElementById('cpOld').value;
  const newPw=document.getElementById('cpNew').value;
  const newPw2=document.getElementById('cpNew2').value;
  const msgEl=document.getElementById('cpMsg');
  if(!oldPw||!newPw||!newPw2){ msg(msgEl,'Vui lòng nhập đầy đủ thông tin.','err'); return; }
  if(newPw.length<6){ msg(msgEl,'Mật khẩu mới phải có ít nhất 6 ký tự.','err'); return; }
  if(newPw!==newPw2){ msg(msgEl,'Mật khẩu mới không khớp.','err'); return; }
  if(oldPw===newPw){ msg(msgEl,'Mật khẩu mới phải khác mật khẩu cũ.','err'); return; }
  msg(msgEl,'Đang xử lý...');
  try{
    await api('changePassword',{oldPassword:oldPw,newPassword:newPw});
    msg(msgEl,'✅ Đổi mật khẩu thành công!','ok');
    setTimeout(()=>closeModal(),1500);
  }catch(e){
    msg(msgEl,e.message,'err');
  }
}

function canBulkLegacySync(){
  if(!APP.user) return false;
  if(hasRole(ROLE_ADMIN)) return true;
  // Dự phòng cho các file USER có ROLE ghi theo tiếng Việt/biến thể cũ.
  const r = normText(APP.user.role || '');
  const title = normText((APP.user.fullname||'') + ' ' + (APP.user.chucvu||''));
  return /superadmin|admin|quan tri|quan tri he thong|quan tri cao cap/.test(r + ' ' + title);
}
async function openBulkLegacyMigration(){
  showModal('<h3>🔁 Đồng bộ tài liệu cũ</h3>', `
    <div class="msg">Chức năng này chỉ dùng để rà soát các dòng tài liệu cũ đang trỏ tới thư mục Drive. Để an toàn, vui lòng đồng bộ từng lịch bằng nút <b>Đồng bộ TL</b> ngay tại từng dòng trong bảng Quản lý lịch.</div>
    <div id="bulkMigStatus" class="msg">Đang kiểm tra dữ liệu...</div>
    <div id="bulkMigSample"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button class="btn" onclick="closeModal()">Đóng</button>
      <button id="btnBulkDryRun" class="btn ghost" onclick="runBulkLegacyMigration(true)">🔎 Rà soát thử</button>
      
    </div>
  `);
  await refreshBulkLegacyStatus();
}
async function refreshBulkLegacyStatus(){
  const box=$('bulkMigStatus'), sample=$('bulkMigSample');
  if(!box) return;
  msg(box,'Đang rà soát tài liệu cũ...');
  try{
    const res=await api('getLegacyMigrationStatus',{limit:500});
    msg(box,`✅ ${res.msg||'Đã rà soát.'}<br>Số lịch cần xử lý: <b>${Number(res.totalMeetings||0)}</b>; ước tính số file: <b>${Number(res.estimatedFiles||0)}</b>.`,res.totalMeetings?'':'ok');
    if(sample){
      const arr=res.sample||[];
      sample.innerHTML=arr.length?`<div class="table-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Lịch</th><th>File trong thư mục cũ</th><th>Tên dòng cũ</th></tr></thead><tbody>${arr.map(x=>`<tr><td class="mono">${esc(x.meetingId)}</td><td>${esc(x.fileCount||0)}</td><td>${esc(x.fileName||'')}</td></tr>`).join('')}</tbody></table></div>`:'';
    }
    const btn=$('btnBulkRun'); if(btn) btn.disabled=!Number(res.totalMeetings||0);
  }catch(e){ msg(box,e.message||String(e),'err'); }
}
async function runBulkLegacyMigration(dryRun){
  const box=$('bulkMigStatus');
  if(!box) return;
  if(!dryRun && !confirm('Đồng bộ toàn bộ tài liệu cũ về thư mục chuẩn LHxxxx?\n\nHệ thống sẽ SAO CHÉP file, không xóa file gốc.')) return;
  const btnRun=$('btnBulkRun'), btnDry=$('btnBulkDryRun');
  if(btnRun) btnRun.disabled=true; if(btnDry) btnDry.disabled=true;
  let totalBatches=0,totalCopied=0,totalSkipped=0,totalMoved=0,lastRemaining=0;
  try{
    while(true){
      totalBatches++;
      msg(box,`${dryRun?'Đang rà soát thử':'Đang đồng bộ'} lô ${totalBatches}...<br>Đã sao chép: <b>${totalCopied}</b>; bỏ qua: <b>${totalSkipped}</b>.`);
      const res=await api('migrateAllMeetingLegacyFiles',{limit:3,timeBudgetMs:22000,mode:'copy',dryRun:!!dryRun});
      totalCopied += Number(res.copied||0);
      totalMoved += Number(res.moved||0);
      totalSkipped += Number(res.skipped||0);
      lastRemaining = Number(res.remainingMeetings||0);
      msg(box,`${res.msg||'Đã xử lý lô.'}<br>Đã sao chép: <b>${totalCopied}</b>; di chuyển: <b>${totalMoved}</b>; bỏ qua: <b>${totalSkipped}</b>; còn lại: <b>${lastRemaining}</b>.`);
      if(dryRun || !res.hasMore || !Number(res.batchSize||0)) break;
      await sleep(800);
    }
    if(dryRun){
      msg(box,`✅ Rà soát thử hoàn tất. Chưa sao chép file. Có thể bấm “Bắt đầu đồng bộ tất cả” để chạy thật.`, 'ok');
    }else{
      msg(box,`✅ Đồng bộ hàng loạt hoàn tất.<br>Đã sao chép: <b>${totalCopied}</b>; bỏ qua: <b>${totalSkipped}</b>; còn lại: <b>${lastRemaining}</b>.`, 'ok');
      await refreshAll();
    }
  }catch(e){
    msg(box,e.message||String(e),'err');
  }finally{
    if(btnRun) btnRun.disabled=false; if(btnDry) btnDry.disabled=false;
  }
}

function showModal(title,body){
  $('modal').innerHTML=`<div class="modal-card"><div class="modal-h">${title}<button class="modal-close" onclick="closeModal()" aria-label="Đóng">✕</button></div><div id="modalBody" class="modal-b">${body}</div></div>`;
  document.body.classList.add('modal-lock');
  $('modal').classList.remove('hide');
}
function closeModal(){APP.detailFiles=[];APP.noteUploadQueue=[];document.body.classList.remove('modal-lock');$('modal').classList.remove('note-modal-open','meeting-modal-open');$('modal').classList.add('hide');$('modal').innerHTML=''}

// ===== V30: EVENT DELEGATION CHO NÚT XEM CHI TIẾT / SỬA =====
// Lý do: các nút lịch được render động bằng data-action. Nếu không gắn bộ lắng nghe
// tập trung thì desktop/mobile bấm sẽ không phản hồi. Bắt cả click và touchend để ổn định trên mobile.
let __lastTouchActionAt = 0;
function handleDelegatedMeetingAction_(ev){
  const target = ev.target;
  if(!target || !target.closest) return;
  const btn = target.closest('[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  if(action !== 'open-detail' && action !== 'edit-meeting' && action !== 'open-note') return;

  // Tránh mobile chạy 2 lần: touchend xong trình duyệt phát sinh click.
  const now = Date.now();
  if(ev.type === 'click' && now - __lastTouchActionAt < 450) return;
  if(ev.type === 'touchend') __lastTouchActionAt = now;

  ev.preventDefault();
  ev.stopPropagation();

  const id = btn.getAttribute('data-meeting-id');
  if(!id) return;
  if(action === 'open-detail') openDetail(id);
  if(action === 'edit-meeting') openMeetingForm(id);
  if(action === 'open-note') openMeetingNote(id, btn.getAttribute('data-meeting-title')||'');
}
document.addEventListener('click', handleDelegatedMeetingAction_, true);
document.addEventListener('touchend', handleDelegatedMeetingAction_, {capture:true, passive:false});

</script>

        if(localStorage.getItem(resetKey) !== '1'){
          const regs = await navigator.serviceWorker.getRegistrations();
          for(const r of regs){ try{ await r.unregister(); }catch(_){} }
          if(window.caches){
            const keys = await caches.keys();
            await Promise.all(keys.filter(k=>/^lct-|lichkv8|hqkv8/i.test(k)).map(k=>caches.delete(k)));
          }
          localStorage.setItem(resetKey,'1');
        }
      }catch(e){ console.warn('Không reset được service worker/cache cũ:', e); }
      navigator.serviceWorker.register('./service-worker.js?v=170').then(function(reg){
        try { reg.update(); } catch(e) {}
      }).catch(function(err){
        console.warn('Không đăng ký được service worker PWA:', err);
      });
    });
  }
})();
