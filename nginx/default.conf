# =============================================================================
# nginx/default.conf
# =============================================================================
# Reverse proxy routing cho Nền tảng Số Thống nhất HQKV8.
#
# Domain: kpihaiquan.vn | Server: 79.108.216.189
# SSL: Let's Encrypt (Certbot managed)
#
# Port mapping:
#   /api/v1/         → KPI Backend     (127.0.0.1:8000) — Production
#   /api/v1/lms/     → LMS Backend     (127.0.0.1:8001)
#   /api/forum/v1/   → Forum Backend   (127.0.0.1:8002)
#   /api/legal/v1/   → Legal Backend   (127.0.0.1:8003)
#   /api/portal/v1/  → Portal Backend  (127.0.0.1:8004)
#   /api/common/     → Common Backend  (127.0.0.1:8005)
#   /internal/       → Common Internal (127.0.0.1:8005) — chỉ localhost
#   /files/          → Local uploads
#   /                → Frontend        (127.0.0.1:3000)
#
# ⚠️ MỞ RỘNG từ config KPI production
# ⚠️ GIỮ NGUYÊN mọi location KPI đang hoạt động
# =============================================================================

# --- MAIN HTTPS SERVER ---
server {
    server_name kpihaiquan.vn www.kpihaiquan.vn;

    # Giới hạn upload file 500MB (cho video LMS tương lai)
    client_max_body_size 500M;

    # =========================================================================
    # API ROUTING
    # =========================================================================

    # KPI Backend (port 8000) — ĐÃ PRODUCTION, GIỮ NGUYÊN
    location /api {
        proxy_pass http://localhost:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # LMS Backend (port 8001) — backend prefix: /api/v1/lms/
    location /api/v1/lms/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forum Backend (port 8002) — backend prefix: /api/forum/v1/
    location /api/forum/v1/ {
        proxy_pass http://localhost:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal Backend (port 8003) — backend prefix: /api/legal/v1/
    location /api/legal/v1/ {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Backend (port 8004) — backend prefix: /api/v1/
    # Rewrite: /api/portal/v1/xxx → http://localhost:8004/api/v1/xxx
    location /api/portal/v1/ {
        proxy_pass http://localhost:8004/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Common Backend (port 8005) — Thông báo, File, KB, KPI Log, Search
    location /api/common/ {
        proxy_pass http://localhost:8005/api/common/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # INTERNAL API — CHỈ cho module nội bộ gọi nhau
    # KHÔNG expose ra internet
    # =========================================================================
    location /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://localhost:8005/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================================================
    # FILE SERVING
    # =========================================================================

    # LMS uploads (served by LMS backend)
    location /uploads/lms/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal uploads (served by Legal backend)
    location /uploads/legal/ {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal uploads (ảnh vinh danh, ảnh tin tức — served by Portal backend)
    location /uploads/portal/ {
        proxy_pass http://localhost:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Common file uploads (local storage / MinIO fallback)
    location /files/ {
        alias /opt/kpihaiquan/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # FRONTEND (Next.js — port 3000)
    # =========================================================================

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Mọi request còn lại → Next.js (SPA routing)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SSL — managed by Certbot
    # =========================================================================
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kpihaiquan.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kpihaiquan.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- HTTP → HTTPS REDIRECT ---
server {
    if ($host = www.kpihaiquan.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kpihaiquan.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kpihaiquan.vn www.kpihaiquan.vn;
    return 404; # managed by Certbot
}
