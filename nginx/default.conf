# =============================================================================
# nginx/default.conf
# =============================================================================
# Reverse proxy routing cho Nền tảng Số Thống nhất HQKV8.
#
# Domain: kpihaiquan.vn | Server: 79.108.216.189
# SSL: Let's Encrypt (Certbot managed)
#
# Port mapping:
#   /api/v1/                → KPI Backend      (127.0.0.1:8000) — Production
#   /api/v1/lms/            → LMS Backend      (127.0.0.1:8001)
#   /api/forum/v1/          → Forum Backend    (127.0.0.1:8002)
#   /api/legal/v1/          → Legal Backend    (127.0.0.1:8003)
#   /api/portal/v1/         → Portal Backend   (127.0.0.1:8004)
#   /api/common/            → Common Backend   (127.0.0.1:8005)
#   /api/v1/hop-khong-giay/ → HKG Backend      (127.0.0.1:8006)
#   /ws/hop-khong-giay/     → HKG WebSocket    (127.0.0.1:8006) — cần Upgrade header
#   /api/v1/chi-tieu/       → Chỉ tiêu Backend (127.0.0.1:8007)
#   /internal/              → Common Internal  (127.0.0.1:8005) — chỉ localhost
#   /files/                 → Local uploads
#   /                       → Frontend         (127.0.0.1:3000)
#
# ⚠️ MỞ RỘNG từ config KPI production
# ⚠️ GIỮ NGUYÊN mọi location KPI đang hoạt động
#
# ⚠️ FILE NÀY PHẢI KHỚP BYTE-TO-BYTE với bản đang chạy trên server:
#       /etc/nginx/sites-available/kpi-haiquan
#    Kiểm tra:  diff nginx/default.conf /etc/nginx/sites-available/kpi-haiquan
#    Triển khai: cp nginx/default.conf /etc/nginx/sites-available/kpi-haiquan \
#                  && nginx -t && systemctl reload nginx
#    Lý do (30/07/2026): repo từng thiếu 2 block HKG so với bản chạy thật. Nếu
#    ai đó copy repo -> server thì /api/v1/hop-khong-giay/ rơi về `location /api`
#    (sang KPI 8000) và /ws/hop-khong-giay/ rơi về `location /` (sang FE 3000):
#    cả module Họp Không Giấy chết trong im lặng, `nginx -t` vẫn báo OK.
# =============================================================================

# --- MAIN HTTPS SERVER ---
server {
    server_name kpihaiquan.vn www.kpihaiquan.vn;

    # Giới hạn upload file 500MB (cho video LMS tương lai)
    client_max_body_size 500M;

    # =========================================================================
    # API ROUTING
    # =========================================================================

    # KPI Backend (port 8000) — ĐÃ PRODUCTION, GIỮ NGUYÊN
    location /api {
        proxy_pass http://localhost:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # LMS Backend (port 8001) — backend prefix: /api/v1/lms/
    location /api/v1/lms/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chi tieu Backend (port 8007) — backend prefix: /api/v1/chi-tieu/
    location /api/v1/chi-tieu/ {
        proxy_pass http://localhost:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HKG / Meeting Backend (port 8006) — backend prefix: /api/v1/hop-khong-giay/
    location /api/v1/hop-khong-giay/ {
        proxy_pass http://localhost:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # HKG WebSocket (port 8006) — BE mount router WS tại prefix RIÊNG
    # /ws/hop-khong-giay (KHÔNG nằm dưới /api/v1/hop-khong-giay).
    # Thêm 30/07/2026: trước đây thiếu location này nên /ws/... rơi vào
    # `location /` và bị proxy sang frontend:3000 → đồng bộ trình chiếu chết.
    location /ws/hop-khong-giay/ {
        proxy_pass http://localhost:8006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS dài hơi: giữ kết nối, BE tự gửi heartbeat ping định kỳ
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Forum Backend (port 8002) — backend prefix: /api/forum/v1/
    location /api/forum/v1/ {
        proxy_pass http://localhost:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal Backend (port 8003) — backend prefix: /api/legal/v1/
    location /api/legal/v1/ {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Backend (port 8004) — backend prefix: /api/v1/
    # Rewrite: /api/portal/v1/xxx → http://localhost:8004/api/v1/xxx
    location /api/portal/v1/ {
        proxy_pass http://localhost:8004/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Common Backend (port 8005) — Thông báo, File, KB, KPI Log, Search
    location /api/common/ {
        proxy_pass http://localhost:8005/api/common/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # INTERNAL API — CHỈ cho module nội bộ gọi nhau
    # KHÔNG expose ra internet
    # =========================================================================
    location /internal/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://localhost:8005/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================================================
    # FILE SERVING
    # =========================================================================

    # LMS uploads (served by LMS backend)
    location /uploads/lms/ {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal uploads (served by Legal backend)
    location /uploads/legal/ {
        proxy_pass http://localhost:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal uploads (ảnh vinh danh, ảnh tin tức — served by Portal backend)
    location /uploads/portal/ {
        proxy_pass http://localhost:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Common file uploads (local storage / MinIO fallback)
    location /files/ {
        alias /opt/kpihaiquan/data/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # XÁC MINH TÊN MIỀN — Zalo Developers
    # =========================================================================
    # Zalo yêu cầu đặt 1 file HTML ở gốc tên miền để chứng minh quyền sở hữu:
    #   https://kpihaiquan.vn/zalo_verifier<MÃ>.html
    #
    # Dùng regex (ưu tiên cao hơn `location /`) nên request KHÔNG rơi vào
    # Next.js. Nhờ vậy không phải build lại frontend — lần xác minh sau chỉ
    # cần thả file mới vào /var/www/zalo-verify/, KHÔNG phải sửa nginx.
    #
    # GIỮ FILE LẠI sau khi xác minh xong: Zalo có thể kiểm tra lại định kỳ,
    # xóa file đi có thể làm mất trạng thái đã xác minh.
    location ~ ^/zalo_verifier[A-Za-z0-9_-]+\.html$ {
        root /var/www/zalo-verify;
        default_type text/html;
        try_files $uri =404;
        access_log /var/log/nginx/zalo-verify.log;
    }

    # =========================================================================
    # FRONTEND (Next.js — port 3000)
    # =========================================================================

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # TRANG CHỦ — tiêm thẻ xác minh tên miền của Zalo vào <head>
    # -------------------------------------------------------------------------
    # Zalo đòi thẻ <meta name="zalo-platform-site-verification"> nằm trong <head>
    # của trang chủ. Trang chủ do Next.js render, mà sửa metadata trong
    # frontend/src/app/layout.tsx thì PHẢI BUILD LẠI — build lại ghi đè các file
    # chunk đang chạy, làm hỏng tab của người đang mở phần mềm.
    #
    # Cách này dùng sub_filter chèn thẳng vào luồng HTML: có hiệu lực ngay, không
    # build, không restart, gỡ ra cũng chỉ mất 1 lần reload.
    #
    # Dùng `location = /` (khớp chính xác) nên CHỈ trang chủ bị ảnh hưởng, các
    # trang khác vẫn đi qua `location /` bên dưới y như cũ.
    #
    # `Accept-Encoding ""` là BẮT BUỘC: nếu Next.js trả HTML đã nén thì sub_filter
    # không đọc được nội dung để thay. Tắt nén chặng nội bộ (localhost) rồi để
    # nginx tự nén lại cho client — không ảnh hưởng gì tới người dùng.
    #
    # KHI NÀO GỠ: sau khi Zalo xác minh xong có thể gỡ, nhưng nên GIỮ vì Zalo có
    # thể kiểm tra lại định kỳ. Nếu sau này thêm thẻ vào layout.tsx và build lại
    # thì PHẢI gỡ khối này, nếu không thẻ sẽ xuất hiện 2 lần.
    location = / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";
        # (sub_filter_types mặc định đã là text/html — khai lại sẽ sinh cảnh báo
        #  "duplicate MIME type" lúc nginx -t, nên không khai)
        sub_filter_once on;
        sub_filter '<head>' '<head><meta name="zalo-platform-site-verification" content="GDII9ucY771YreTefD0HJaxUmL2Yg1iBDJap" />';
    }

    # Mọi request còn lại → Next.js (SPA routing)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SSL — managed by Certbot
    # =========================================================================
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kpihaiquan.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kpihaiquan.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- HTTP → HTTPS REDIRECT ---
server {
    if ($host = www.kpihaiquan.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kpihaiquan.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kpihaiquan.vn www.kpihaiquan.vn;
    return 404; # managed by Certbot
}
