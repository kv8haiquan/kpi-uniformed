# =============================================================================
# nginx/default.conf
# =============================================================================
# Reverse proxy routing cho multi-service platform HQKV8.
#
# Port mapping:
#   /api/v1/        → KPI Backend    (localhost:8000) — Production
#   /api/lms/v1/    → LMS Backend    (localhost:8001)
#   /api/forum/v1/  → Forum Backend  (localhost:8002)
#   /api/legal/v1/  → Legal Backend  (localhost:8003)
#   /api/portal/v1/ → Portal Backend (localhost:8004)
#   /               → Frontend       (localhost:3000)
# =============================================================================

upstream kpi_backend {
    server localhost:8000;
}

upstream lms_backend {
    server localhost:8001;
}

upstream forum_backend {
    server localhost:8002;
}

upstream legal_backend {
    server localhost:8003;
}

upstream portal_backend {
    server localhost:8004;
}

upstream frontend {
    server localhost:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # KPI Backend (production)
    # -------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://kpi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # LMS Backend
    # -------------------------------------------------------------------------
    location /api/lms/v1/ {
        proxy_pass http://lms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Forum Backend
    # -------------------------------------------------------------------------
    location /api/forum/v1/ {
        proxy_pass http://forum_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Legal Backend
    # -------------------------------------------------------------------------
    location /api/legal/v1/ {
        proxy_pass http://legal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Portal Backend
    # -------------------------------------------------------------------------
    location /api/portal/v1/ {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Legal Backend static files (uploaded documents)
    # Serve file PDF/DOCX trực tiếp từ FastAPI StaticFiles trên port 8003.
    # Phải đặt TRƯỚC catch-all "/" để nginx ưu tiên route này.
    # -------------------------------------------------------------------------
    location /uploads/legal/ {
        proxy_pass http://legal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Frontend (catch-all)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
